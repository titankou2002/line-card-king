<style>
  :root {
    --bg: #f6f4ef;
    --surface: #fffdf9;
    --raised: #eeeae2;
    --border: rgba(31, 27, 22, 0.11);
    --t1: #1f1b16;
    --t2: #5e554a;
    --t3: #7b7266;
    --accent: #c5ae6e;
    --accent-text: #1f1b16;
    --head-bg: #23201b;
    --body-bg: #23201b;
    --foot-bg: #23201b;
    --btn2-bg: #332e27;
    --card-fg: #f1ece2;
    --card-font: "Microsoft JhengHei", "微軟正黑體", sans-serif;
    --line-green: #06c755;
    --chat-bg-light: #8cabd9;
    --chat-bg-dark: #111315;
    --err: #b4412f;
  }

  * { box-sizing: border-box; margin: 0; padding: 0; }
  html, body { overflow-x: hidden; width: 100%; max-width: 100vw; }
  body {
    font-family: "Microsoft JhengHei", "微軟正黑體", sans-serif;
    background: var(--bg);
    color: var(--t1);
    min-height: 100vh;
  }

  /* 頂部列 */
  .topbar {
    position: sticky; top: 0; z-index: 30;
    background: rgba(255, 253, 249, 0.96);
    border-bottom: 1px solid var(--border);
    padding: 8px 10px;
    display: flex; align-items: center; justify-content: space-between; gap: 6px;
  }
  .topbar-title { display: flex; align-items: center; gap: 6px; min-width: 0; }
  .topbar h1 { font-size: 14px; font-weight: 700; white-space: nowrap; }
  .toolbar { display: flex; align-items: center; gap: 5px; flex-shrink: 0; }

  .btn {
    appearance: none; border: 1px solid var(--border); background: var(--surface);
    color: var(--t1); font-size: 13px; font-weight: 600; padding: 7px 13px;
    border-radius: 8px; cursor: pointer; display: inline-flex; align-items: center;
    justify-content: center; gap: 5px; text-decoration: none; font-family: inherit; white-space: nowrap;
  }
  .btn:hover { background: var(--raised); }
  .btn:disabled { opacity: 0.45; cursor: not-allowed; }
  .btn-pri { background: #23201b; border-color: #23201b; color: #fff; }
  .btn-line { background: var(--line-green); border-color: var(--line-green); color: #fff; font-weight: 700; }
  .btn-line:hover { background: #05b34c; }
  .btn-danger { color: var(--err); border-color: rgba(180,65,47,0.3); }
  .btn-sm { padding: 5px 10px; font-size: 12px; border-radius: 7px; }

  .icon-btn {
    appearance: none; width: 32px; height: 32px; border-radius: 8px;
    border: 1px solid var(--border); background: var(--surface); color: var(--t1);
    display: inline-flex; align-items: center; justify-content: center; cursor: pointer; flex-shrink: 0;
  }
  .icon-btn:hover { background: var(--raised); }
  .icon-btn.acct-ico { border-radius: 999px; background: #23201b; border-color: #23201b; color: var(--accent); font-size: 13px; font-weight: 700; }

  /* 單欄精簡置中工作台（手機與電腦皆零來回捲動） */
  .studio {
    max-width: 480px;
    width: 100%;
    margin: 0 auto;
    padding: 12px 12px 48px;
    display: flex;
    flex-direction: column;
    gap: 10px;
  }

  /* 頂部快選條：拍名片 + 8 款橫滑版型 */
  .top-strip {
    display: flex; align-items: center; gap: 8px; width: 100%;
  }
  .style-bar {
    display: flex; overflow-x: auto; flex-wrap: nowrap; gap: 6px; width: 100%;
    padding: 2px 0; -webkit-overflow-scrolling: touch;
  }
  .style-bar::-webkit-scrollbar { display: none; }
  .style-opt {
    flex: 0 0 auto; border: 1.5px solid var(--border); border-radius: 999px;
    padding: 6px 13px; background: var(--surface); cursor: pointer;
    font-family: inherit; font-size: 12.5px; font-weight: 700; color: var(--t1); white-space: nowrap;
  }
  .style-opt.active { border-color: #23201b; background: #23201b; color: var(--accent); }

  /* 預覽舞台 */
  .canvas-stage {
    border-radius: 18px;
    background: var(--chat-bg-light);
    padding: 14px 12px 16px;
    display: flex; flex-direction: column; align-items: center; gap: 10px;
    transition: background 0.2s;
  }
  .canvas-stage.dark-chat { background: var(--chat-bg-dark); }

  /* 所見即所得單張名片 */
  .mega-card {
    width: 100%; max-width: 344px; border-radius: 18px; overflow: hidden;
    box-shadow: 0 12px 32px rgba(0,0,0,0.22);
    font-family: var(--card-font);
    background: var(--body-bg);
    color: var(--card-fg);
  }
  .mega-card.style-frame { border: 3px solid var(--card-fg); border-radius: 12px; }
  .mc-top-bar { height: 5px; background: var(--accent); }
  .mc-head-area { background: var(--head-bg); }
  .mc-body { padding: 12px 18px; display: flex; flex-direction: column; gap: 7px; background: var(--body-bg); }
  .mc-foot { padding: 6px 18px 14px; display: flex; flex-direction: column; gap: 8px; background: var(--foot-bg); }

  /* 行內直接點字編輯樣式（使用原生 input，手機/電腦 100% 支援原生全選） */
  .ed-wrap { display: inline-flex; align-items: center; gap: 4px; max-width: 100%; }
  .ed-wrap-full { display: flex; align-items: center; gap: 4px; width: 100%; }
  .mc-inp {
    appearance: none; -webkit-appearance: none; border: none; outline: none; background: transparent;
    color: inherit; font-family: inherit; font-size: inherit; font-weight: inherit; line-height: inherit;
    padding: 1px 3px; margin: 0; border-radius: 4px; min-width: 24px; max-width: 100%;
    field-sizing: content; -webkit-user-select: text; user-select: text;
    transition: background 0.12s, box-shadow 0.12s; cursor: text;
  }
  .mc-inp:not([readonly]):hover { background: rgba(197, 174, 110, 0.14); }
  .mc-inp:not([readonly]):focus { background: rgba(197, 174, 110, 0.22); box-shadow: 0 0 0 1.5px var(--accent); }
  .mc-inp[readonly] { cursor: default; }
  .mc-inp-full { width: 100%; flex: 1; min-width: 0; }

  .del-x {
    appearance: none; border: none; background: rgba(128,128,128,0.28); color: inherit;
    width: 16px; height: 16px; border-radius: 999px; font-size: 10px; line-height: 1;
    display: inline-flex; align-items: center; justify-content: center; cursor: pointer;
    flex-shrink: 0; opacity: 0.65;
  }
  .del-x:hover { opacity: 1; background: var(--err); color: #fff; }
  .clean-view .del-x, .clean-view .add-row-inline { display: none !important; }

  .add-row-inline {
    appearance: none; border: 1px dashed rgba(197,174,110,0.45); background: transparent;
    color: var(--accent); font-size: 11.5px; font-weight: 700; padding: 4px 10px;
    border-radius: 6px; cursor: pointer; align-self: flex-start; margin-top: 2px; font-family: inherit;
  }

  .color-pick-mode [data-cslot] { cursor: crosshair !important; }
  .color-pick-mode [data-cslot]:hover { outline: 2px dashed var(--accent); outline-offset: -2px; }

  .mc-brand-row { display: flex; align-items: center; justify-content: space-between; gap: 8px; margin-bottom: 8px; }
  .mc-logo { height: var(--logo-h, 32px); color: var(--accent); flex-shrink: 0; display: inline-flex; align-items: center; cursor: pointer; }
  .mc-logo img { height: var(--logo-h, 32px); width: auto; max-width: 180px; object-fit: contain; display: block; }
  .mc-co-name { font-size: 11.5px; font-weight: 600; opacity: 0.8; }
  .mc-name-line { display: flex; align-items: baseline; flex-wrap: wrap; gap: 6px; }
  .mc-name { font-size: 21px; font-weight: 700; line-height: 1.25; }
  .mc-en-name { font-size: 15px; font-weight: 700; color: var(--accent); }
  .mc-slogan { font-size: 12px; opacity: 0.82; margin-top: 5px; line-height: 1.4; }
  .mc-sep { height: 1px; background: currentColor; opacity: 0.14; margin: 0 18px; }

  .mc-row { display: flex; align-items: center; gap: 8px; font-size: 12.5px; line-height: 1.4; }
  .mc-lbl { min-width: 34px; flex-shrink: 0; color: var(--accent); font-size: 11.5px; font-weight: 700; }
  .mc-lbl-ico { width: 18px; height: 18px; flex-shrink: 0; color: var(--accent); display: inline-flex; align-items: center; justify-content: center; cursor: pointer; }
  .mc-val { flex: 1; min-width: 0; word-break: break-word; }
  .mc-row-tools { display: flex; flex-wrap: wrap; gap: 6px; margin-top: 2px; }
  .clean-view .mc-row-tools { display: none !important; }

  .mc-btn-link {
    height: 26px; background: transparent; border: none; color: var(--accent);
    font-size: 12.5px; font-weight: 600; cursor: pointer; font-family: inherit;
  }

  /* 10 顆統一尺寸可拖曳快捷按鈕（智慧平衡分排） */
  .mc-action-grid { display: flex; flex-direction: column; gap: 7px; padding: 4px 0 2px; }
  .mc-icon-row { display: flex; justify-content: center; gap: 7px; }
  .mc-icon-chip {
    width: 50px; height: 50px; border-radius: 11px;
    background: rgba(128,128,128,0.16); border: 1px solid rgba(197,174,110,0.36);
    color: var(--accent); display: inline-flex; flex-direction: column; align-items: center; justify-content: center; gap: 3px;
    text-decoration: none; cursor: grab; user-select: none; -webkit-user-select: none; touch-action: none;
    transition: transform 0.14s, border-color 0.14s, box-shadow 0.14s, opacity 0.14s;
  }
  .clean-view .mc-icon-chip { cursor: pointer; touch-action: auto; }
  .mc-icon-chip.dragging { opacity: 0.45; transform: scale(1.08); cursor: grabbing; }
  .mc-icon-chip.drag-over { border-color: var(--accent); box-shadow: 0 0 0 2px var(--accent); transform: scale(1.06); }
  .mc-icon-lbl { font-size: 10px; font-weight: 700; line-height: 1; letter-spacing: 0.02em; pointer-events: none; }
  .mc-icon-chip svg { pointer-events: none; }
  .mc-media-click { cursor: pointer; }

  .mc-video-box { position: relative; width: 100%; aspect-ratio: 16/9; background: #14120f; overflow: hidden; }
  .mc-video-box video, .mc-video-box img { width: 100%; height: 100%; object-fit: cover; display: block; }
  .mc-yt-play { position: absolute; inset: 0; background: rgba(0,0,0,0.24); display: flex; align-items: center; justify-content: center; }
  .mc-yt-play span { width: 48px; height: 34px; border-radius: 9px; background: rgba(0,0,0,0.72); color: #fff; display: inline-flex; align-items: center; justify-content: center; }
  .mc-photo { width: 60px; height: 74px; border-radius: 10px; overflow: hidden; flex-shrink: 0; border: 1.5px solid var(--accent); }
  .mc-photo img { width: 100%; height: 100%; object-fit: cover; display: block; }
  .mc-hero-box { position: relative; height: 176px; background: #2c2822; overflow: hidden; }
  .mc-hero-img { width: 100%; height: 100%; object-fit: cover; display: block; }
  .mc-hero-grad { position: absolute; inset: 0; background: linear-gradient(180deg, rgba(20,18,15,0.12) 0%, rgba(20,18,15,0.2) 40%, rgba(20,18,15,0.88) 100%); display: flex; flex-direction: column; justify-content: space-between; padding: 12px 16px; }
  .mc-logo-pill { background: rgba(255,253,249,0.92); padding: 4px 8px; border-radius: 6px; display: inline-flex; }
  .mc-logo-pill img { height: 16px; width: auto; max-width: 100px; display: block; }
  /* 側邊滿版長向影像版型（左圖/影直拉到底，右側整合完整資訊與按鈕） */
  .mc-side-full { display: grid; grid-template-columns: 102px minmax(0, 1fr); align-items: stretch; min-height: 390px; }
  .mc-side-media { position: relative; background: #14120f; overflow: hidden; height: 100%; }
  .mc-side-media img, .mc-side-media video { position: absolute; inset: 0; width: 100%; height: 100%; object-fit: cover; display: block; }
  .mc-side-col { display: flex; flex-direction: column; min-width: 0; background: var(--body-bg); }
  .mc-side-head { padding: 14px 12px 10px; display: flex; flex-direction: column; gap: 4px; background: var(--head-bg); }
  .mc-side-full .mc-name { font-size: 18px; }
  .mc-side-full .mc-en-name { font-size: 13px; }
  .mc-side-full .mc-co-name { font-size: 11px; }
  .mc-side-full .mc-slogan { font-size: 11px; margin-top: 2px; }
  .mc-side-full .mc-sep { margin: 0 12px; }
  .mc-side-full .mc-body { padding: 10px 12px; gap: 5px; flex: 1; }
  .mc-side-full .mc-row { font-size: 11.5px; gap: 5px; }
  .mc-side-full .mc-lbl { min-width: 28px; font-size: 10.5px; }
  .mc-side-full .mc-foot { padding: 4px 10px 12px; gap: 6px; }
  .mc-side-full .mc-icon-row { gap: 4px; }
  .mc-side-full .mc-icon-chip { width: 39px; height: 40px; border-radius: 9px; gap: 2px; }
  .mc-side-full .mc-icon-chip svg { width: 15px; height: 15px; }
  .mc-side-full .mc-icon-lbl { font-size: 8.5px; }

  .mc-block-top { padding: 16px 18px 14px; color: #FFFFFF; }
  .mc-block-top .mc-en-name { color: #F5E6C4; }

  /* 點擊按鈕時浮出的極簡單行編輯條 */
  .inline-bar {
    display: none; width: 100%; max-width: 100%; box-sizing: border-box;
    background: var(--surface); border: 1px solid var(--border); border-radius: 12px;
    padding: 7px 8px; gap: 6px; align-items: center; box-shadow: 0 6px 20px rgba(0,0,0,0.12);
    overflow: hidden;
  }
  .inline-bar input {
    flex: 1 1 0; width: 0; min-width: 0; height: 36px; padding: 0 10px;
    border: 1px solid var(--border); border-radius: 8px; font-size: 16px; font-family: inherit;
    background: #fff;
  }
  .inline-bar .btn { flex-shrink: 0; padding: 0 10px; height: 36px; }

  /* 進階設定收合區 */
  .adv-card {
    background: var(--surface); border: 1px solid var(--border);
    border-radius: 14px; padding: 12px; display: flex; flex-direction: column; gap: 12px;
    width: 100%; min-width: 0; max-width: 100%;
  }
  .dock-tabs {
    display: grid; grid-template-columns: repeat(3, 1fr); gap: 4px;
    background: var(--raised); padding: 4px; border-radius: 9px;
  }
  .dock-tab {
    border: none; background: transparent; padding: 7px 4px; border-radius: 6px;
    font-size: 12.5px; font-weight: 700; color: var(--t2); cursor: pointer; font-family: inherit;
  }
  .dock-tab.active { background: var(--surface); color: var(--t1); }
  .dock-pane { display: none; flex-direction: column; gap: 12px; min-width: 0; }
  .dock-pane.active { display: flex; }

  .slot-tabs { display: flex; flex-wrap: wrap; gap: 4px; background: var(--raised); padding: 3px; border-radius: 8px; }
  .slot-tab { border: none; background: transparent; padding: 4px 9px; border-radius: 6px; font-size: 12px; font-weight: 700; color: var(--t2); cursor: pointer; font-family: inherit; }
  .slot-tab.active { background: var(--surface); color: var(--t1); }

  .color-row { display: flex; align-items: center; gap: 8px; }
  .color-picker-wrap { position: relative; width: 38px; height: 34px; border-radius: 8px; overflow: hidden; border: 1px solid var(--border); flex-shrink: 0; }
  .color-picker-wrap input[type="color"] { position: absolute; inset: -6px; width: 52px; height: 48px; border: none; cursor: pointer; }
  .swatches { display: flex; flex-wrap: wrap; gap: 8px; }
  .swatch { width: 26px; height: 26px; border-radius: 999px; border: 2px solid transparent; cursor: pointer; box-shadow: inset 0 0 0 1px rgba(0,0,0,0.12); }
  .swatch.active { border-color: #1f1b16; }

  .ext-stack { display: flex; flex-direction: column; gap: 7px; }
  .ext-row {
    display: grid; grid-template-columns: 44px 82px minmax(0, 1fr); align-items: center; gap: 6px;
    padding: 6px 8px; background: var(--bg); border: 1px solid var(--border); border-radius: 9px;
  }
  .ext-mv { display: inline-flex; gap: 2px; }
  .ext-mv button {
    appearance: none; border: 1px solid var(--border); background: var(--surface); color: var(--t2);
    width: 20px; height: 26px; border-radius: 5px; font-size: 11px; cursor: pointer;
    display: inline-flex; align-items: center; justify-content: center; padding: 0;
  }
  .ext-mv button:hover { background: var(--raised); color: var(--t1); }
  .ext-chk { display: inline-flex; align-items: center; gap: 5px; font-size: 12px; font-weight: 700; cursor: pointer; white-space: nowrap; }
  .ext-chk input { width: 15px; height: 15px; accent-color: #23201b; }
  .ext-row input[type="text"], .ext-row input[type="email"] {
    height: 32px; padding: 0 9px; border: 1px solid var(--border); border-radius: 7px;
    font-size: 12.5px; background: #fff; font-family: inherit; width: 100%; min-width: 0;
  }

  .modal-bg { display: none; position: fixed; inset: 0; z-index: 200; background: rgba(31,27,22,0.58); align-items: center; justify-content: center; padding: 20px; }
  .modal-card { background: #fffdf9; border-radius: 18px; padding: 24px; max-width: 360px; width: 100%; text-align: center; display: flex; flex-direction: column; gap: 12px; }
  .toast { position: fixed; bottom: 20px; left: 50%; transform: translateX(-50%) translateY(20px); background: #1f1b16; color: #fff; padding: 9px 16px; border-radius: 10px; font-size: 12.5px; opacity: 0; pointer-events: none; transition: 0.2s; z-index: 250; }
  .toast.show { opacity: 1; transform: translateX(-50%) translateY(0); }

  .vid-prog-wrap { display: none; flex-direction: column; gap: 4px; width: 100%; }
  .vid-prog-track { width: 100%; height: 6px; border-radius: 999px; background: var(--raised); overflow: hidden; }
  .vid-prog-fill { height: 100%; width: 0%; background: var(--accent); border-radius: 999px; transition: width 0.15s ease; }
  .vid-prog-txt { font-size: 11.5px; font-weight: 700; color: var(--t2); display: flex; justify-content: space-between; }
</style>
</head>
<body>

<header class="topbar">
  <div class="topbar-title">
    <svg width="28" height="28" viewBox="0 0 64 64">
      <rect width="64" height="64" rx="14" fill="#23201B"/>
      <rect x="12" y="18" width="40" height="28" rx="5" fill="none" stroke="#C5AE6E" stroke-width="4"/>
      <line x1="18" y1="27" x2="36" y2="27" stroke="#C5AE6E" stroke-width="3.5" stroke-linecap="round"/>
      <line x1="18" y1="35" x2="30" y2="35" stroke="#E8D9AD" stroke-width="3" stroke-linecap="round"/>
      <circle cx="43" cy="31" r="4" fill="#C5AE6E"/>
    </svg>
    <h1>LINE 名片王</h1>
  </div>
  <div class="toolbar">

/* 手機本機自動存檔（localStorage + IndexedDB 存影片與高畫質圖檔） */
function openLocalDB() {
  return new Promise((resolve, reject) => {
    if (!window.indexedDB) { reject(new Error("no idb")); return; }
    const req = indexedDB.open("CardKingLocalDB", 1);
    req.onupgradeneeded = () => { if (!req.result.objectStoreNames.contains("media")) req.result.createObjectStore("media"); };
    req.onsuccess = () => resolve(req.result);
    req.onerror = () => reject(req.error);
  });
}
async function idbPut(key, val) {
  try {
    const db = await openLocalDB();
    await new Promise((res, rej) => {
      const tx = db.transaction("media", "readwrite");
      tx.objectStore("media").put(val, key);
      tx.oncomplete = res; tx.onerror = () => rej(tx.error);
    });
  } catch (e) {}
}
async function idbGet(key) {
  try {
    const db = await openLocalDB();
    return await new Promise((res, rej) => {
      const tx = db.transaction("media", "readonly");
      const r = tx.objectStore("media").get(key);
      r.onsuccess = () => res(r.result); r.onerror = () => rej(r.error);
    });
  } catch (e) { return null; }
}
async function idbDel(key) {
  try {
    const db = await openLocalDB();
    await new Promise((res, rej) => {
      const tx = db.transaction("media", "readwrite");
      tx.objectStore("media").delete(key);
      tx.oncomplete = res; tx.onerror = () => rej(tx.error);
    });
  } catch (e) {}
}

function onQuickMediaPick(e) {
  const f = e.target.files && e.target.files[0]; if (!f) return;
  const isVid = (f.type && f.type.startsWith("video/")) || /\.(mp4|mov|m4v|webm|3gp)$/i.test(f.name || "");
  if (isVid) {
    onVideoPick(e);
    return;
  }
  const isImg = (f.type && f.type.startsWith("image/")) || /\.(jpg|jpeg|png|webp|heic|gif)$/i.test(f.name || "");
  if (isImg) {
    const img = new Image();
    img.onload = () => {
      const c = document.createElement("canvas");
      const sc = Math.min(1, 1080 / Math.max(img.naturalWidth, img.naturalHeight));
      c.width = Math.round(img.naturalWidth * sc); c.height = Math.round(img.naturalHeight * sc);
      c.getContext("2d").drawImage(img, 0, 0, c.width, c.height);
      c.toBlob(b => { if (b) idbPut("photo", b); }, "image/jpeg", 0.86);
      state.photoUrl = c.toDataURL("image/jpeg", 0.86);
      state.showPhoto = true;
      localVideoBlob = null; idbDel("video");

      document.getElementById("inVideoUrl").value = "";

      const chk = document.getElementById("chkPhoto"); if (chk) chk.checked = true;
      renderPreview();
      toast("圖片已更新並存於手機");

    img.src = URL.createObjectURL(f);
  }
  e.target.value = "";
}

function bindActionDrag(mount) {
  const chips = mount.querySelectorAll(".mc-icon-chip[data-akey]");
  chips.forEach(chip => {
    chip.addEventListener("pointerdown", (e) => {
      if (cleanView) return;
      if (e.button && e.button !== 0) return;
      const dragKey = chip.dataset.akey;
      const sx = e.clientX, sy = e.clientY;
      let dragging = false;
      let overKey = "";
      try { chip.setPointerCapture(e.pointerId); } catch (err) {}

      const clearOver = () => mount.querySelectorAll(".mc-icon-chip.drag-over").forEach(x => x.classList.remove("drag-over"));
      const onMove = (ev) => {
        if (!dragging && Math.hypot(ev.clientX - sx, ev.clientY - sy) > 8) {
          dragging = true;
          chip.classList.add("dragging");
        }
        if (!dragging) return;
        clearOver();
        chip.style.pointerEvents = "none";
        const hit = document.elementFromPoint(ev.clientX, ev.clientY);
        chip.style.pointerEvents = "";
        const target = hit && hit.closest ? hit.closest(".mc-icon-chip[data-akey]") : null;
        if (target && target.dataset.akey !== dragKey) {
          target.classList.add("drag-over");
          overKey = target.dataset.akey;
        } else {
          overKey = "";
        }
      };
      const onUp = () => {
        chip.classList.remove("dragging");
        clearOver();
        chip.removeEventListener("pointermove", onMove);
        chip.removeEventListener("pointerup", onUp);
        chip.removeEventListener("pointercancel", onUp);
        if (dragging && overKey && overKey !== dragKey) {
          const ord = ensureActionOrder();
          const from = ord.indexOf(dragKey), to = ord.indexOf(overKey);
          if (from >= 0 && to >= 0) {
            ord.splice(from, 1);
            ord.splice(to, 0, dragKey);
            state.actionOrder = ord;
            renderSocialControls();
            renderPreview();
          }
        } else if (!dragging) {
          openActionEditor(dragKey);
        }
      };
      chip.addEventListener("pointermove", onMove);
      chip.addEventListener("pointerup", onUp);
      chip.addEventListener("pointercancel", onUp);
    });
  });
}

/* Logo 自動去背 + 自動裁掉空白邊界 + 純色處理 */
function processLogoCanvas(src, opts) {
  const sw = src.naturalWidth || src.width, sh = src.naturalHeight || src.height;
  if (!sw || !sh) return "";
  const sc = Math.min(1, 640 / Math.max(sw, sh));
  const w = Math.max(1, Math.round(sw * sc)), h = Math.max(1, Math.round(sh * sc));
  const c = document.createElement("canvas");
  c.width = w; c.height = h;
  const ctx = c.getContext("2d");
  ctx.drawImage(src, 0, 0, w, h);

  const imgData = ctx.getImageData(0, 0, w, h);
  const px = imgData.data;
  const corners = [0, (w - 1) * 4, ((h - 1) * w) * 4, ((h - 1) * w + (w - 1)) * 4];
  const transparentCorners = corners.filter(idx => px[idx + 3] < 128).length;

  if (opts.removeBg && transparentCorners < 2) {
    let br = 0, bg = 0, bb = 0;
    corners.forEach(idx => { br += px[idx]; bg += px[idx + 1]; bb += px[idx + 2]; });
    br /= 4; bg /= 4; bb /= 4;
    for (let i = 0; i < px.length; i += 4) {
      if (px[i + 3] === 0) continue;
      const dist = Math.hypot(px[i] - br, px[i + 1] - bg, px[i + 2] - bb);
      if (dist < 38) px[i + 3] = 0;
      else if (dist < 76) px[i + 3] = Math.round(((dist - 38) / 38) * px[i + 3]);
    }
  }

  if (opts.mono && opts.accentHex) {
    const hc = opts.accentHex.replace("#", "");
    const ar = parseInt(hc.slice(0, 2), 16), ag = parseInt(hc.slice(2, 4), 16), ab = parseInt(hc.slice(4, 6), 16);
    for (let i = 0; i < px.length; i += 4) {
      if (px[i + 3] > 0) { px[i] = ar; px[i + 1] = ag; px[i + 2] = ab; }
    }
  }
  ctx.putImageData(imgData, 0, 0);

  // 自動緊密裁切透明白邊，避免文字 Logo 在白框裡縮成一小點
  let minX = w, minY = h, maxX = -1, maxY = -1;
  for (let y = 0; y < h; y++) {
    for (let x = 0; x < w; x++) {
      if (px[(y * w + x) * 4 + 3] > 18) {
        if (x < minX) minX = x;
        if (x > maxX) maxX = x;
        if (y < minY) minY = y;
        if (y > maxY) maxY = y;
      }
    }
  }
  if (maxX >= minX && maxY >= minY) {
    const pad = 4;
    const tw = (maxX - minX + 1) + pad * 2, th = (maxY - minY + 1) + pad * 2;
    const out = document.createElement("canvas");
    out.width = tw; out.height = th;
    out.getContext("2d").drawImage(c, minX, minY, maxX - minX + 1, maxY - minY + 1, pad, pad, maxX - minX + 1, maxY - minY + 1);
    return out.toDataURL("image/png");
  }
  return c.toDataURL("image/png");
}

function reprocessLogoIfLoaded() {
  if (!rawLogoSource) return;
  const processed = processLogoCanvas(rawLogoSource, {
    removeBg: state.logoRemoveBg !== false,
    mono: state.logoMono !== false,
    accentHex: state.color
  });
  if (processed) state.logoUrl = processed;
}

/* 拍名片 AI 辨識 + 自動去背裁切 Logo */
function cropLogoFromCard(img, box) {
  if (!Array.isArray(box) || box.length !== 4) return "";
  let [ymin, xmin, ymax, xmax] = box.map(Number);
  if ([ymin, xmin, ymax, xmax].some(isNaN) || ymax <= ymin || xmax <= xmin) return "";
  const iw = img.naturalWidth, ih = img.naturalHeight;
  const padX = (xmax - xmin) * 0.04, padY = (ymax - ymin) * 0.04;
  const sx = Math.max(0, Math.round(((xmin - padX) / 1000) * iw));
  const sy = Math.max(0, Math.round(((ymin - padY) / 1000) * ih));
  const sw = Math.min(iw - sx, Math.max(10, Math.round(((xmax - xmin + padX * 2) / 1000) * iw)));
  const sh = Math.min(ih - sy, Math.max(10, Math.round(((ymax - ymin + padY * 2) / 1000) * ih)));
  const c = document.createElement("canvas");
  c.width = sw; c.height = sh;
  c.getContext("2d").drawImage(img, sx, sy, sw, sh, 0, 0, sw, sh);
  rawLogoSource = c;
  c.toBlob(b => { if (b) idbPut("rawLogo", b); }, "image/png");
  return processLogoCanvas(c, { removeBg: state.logoRemoveBg !== false, mono: state.logoMono !== false, accentHex: state.color });
}

/* 從影片自動擷取封面縮圖（取代舊預設月亮封面，讓 LINE 預覽圖同步更新） */
async function captureVideoPoster(videoEl) {
  try {
    const vw = videoEl.videoWidth || 720, vh = videoEl.videoHeight || 405;
    if (!vw || !vh) return "";
    if (videoEl.currentTime < 0.15 && (!isFinite(videoEl.duration) || videoEl.duration > 0.3)) {
      await new Promise(res => {
        const done = () => { videoEl.removeEventListener("seeked", done); res(); };
        videoEl.addEventListener("seeked", done);
        setTimeout(done, 500);
        try { videoEl.currentTime = 0.2; } catch (e) { done(); }
      });
    }
    const sc = Math.min(1, 720 / Math.max(vw, vh));
    const c = document.createElement("canvas");
    c.width = Math.max(1, Math.round(vw * sc));
    c.height = Math.max(1, Math.round(vh * sc));
    c.getContext("2d").drawImage(videoEl, 0, 0, c.width, c.height);
    const dataUrl = c.toDataURL("image/jpeg", 0.84);
    c.toBlob(b => { if (b) idbPut("photo", b); }, "image/jpeg", 0.84);
    return dataUrl;
  } catch (e) { return ""; }
}

/* 影片超過 10 秒自動裁切成前 10 秒（並壓在 10MB 內） */
function trimVideoTo10s(videoEl, fallbackBlob) {
  return new Promise(async (resolve) => {
    try {
      const vw = videoEl.videoWidth || 720, vh = videoEl.videoHeight || 405;
      const sc = Math.min(1, 720 / Math.max(vw, vh));
      const c = document.createElement("canvas");
      c.width = Math.max(2, Math.round(vw * sc) & ~1);
      c.height = Math.max(2, Math.round(vh * sc) & ~1);
      const ctx = c.getContext("2d");
      if (typeof c.captureStream !== "function" || typeof MediaRecorder === "undefined") {
        resolve(fallbackBlob);
        return;
      }
      const stream = c.captureStream(24);
      const mimeType = ["video/mp4;codecs=avc1", "video/mp4", "video/webm;codecs=vp8", "video/webm"].find(t => {
        try { return MediaRecorder.isTypeSupported(t); } catch (e) { return false; }
      }) || "";
      const rec = mimeType ? new MediaRecorder(stream, { mimeType, videoBitsPerSecond: 1800000 }) : new MediaRecorder(stream, { videoBitsPerSecond: 1800000 });
      const chunks = [];
      rec.ondataavailable = (ev) => { if (ev.data && ev.data.size > 0) chunks.push(ev.data); };
      rec.onstop = () => {
        const out = chunks.length ? new Blob(chunks, { type: mimeType.split(";")[0] || "video/mp4" }) : fallbackBlob;
        resolve(out.size > 0 ? out : fallbackBlob);
      };
      videoEl.currentTime = 0;
      videoEl.muted = true;
      await videoEl.play();
      rec.start(250);
      const startAt = performance.now();
      const targetMs = Math.min(10000, Math.max(1000, (videoEl.duration || 10) * 1000));
      let rafId = 0;
      const tick = () => {
        const elapsed = performance.now() - startAt;
        try { ctx.drawImage(videoEl, 0, 0, c.width, c.height); } catch (e) {}
        setVidProgress(25 + Math.min(68, (elapsed / targetMs) * 68), "自動裁切前 10 秒...");
        if (elapsed >= targetMs || videoEl.ended) {
          cancelAnimationFrame(rafId);
          videoEl.pause();
          if (rec.state !== "inactive") rec.stop();
          return;
        }
        rafId = requestAnimationFrame(tick);
      };
      rafId = requestAnimationFrame(tick);
    } catch (e) {
      resolve(fallbackBlob);
    }
  });
}

function onVideoPick(e) {
  const f = e.target.files && e.target.files[0]; if (!f) return;
  if (f.size > 60 * 1024 * 1024) {
    toast("原始影片超過 60MB，請先剪短再選");
    e.target.value = "";
    return;
  }
  setVidProgress(5, "讀取影片檔案...");
  const fr = new FileReader();
  fr.onprogress = (ev) => {
    if (ev.lengthComputable && ev.total > 0) {
      setVidProgress(5 + (ev.loaded / ev.total) * 18, "讀取影片中...");
    }
  };
  fr.onerror = () => {
    setVidProgress(null);
    toast("無法讀取影片，請改用 Safari 開啟");
  };
  fr.onload = () => {
    setVidProgress(24, "檢查影片長度...");
    const mime = f.type || (/\.mov$/i.test(f.name) ? "video/quicktime" : "video/mp4");
    const safeBlob = new Blob([fr.result], { type: mime });
    const rawUrl = URL.createObjectURL(safeBlob);
    let settled = false;
    const finishApply = async (finalBlob, posterUrl) => {
      if (settled) return;
      settled = true;
      setVidProgress(95, "儲存至手機本機...");
      const finalUrl = URL.createObjectURL(finalBlob);
      localVideoBlob = finalBlob;
      await idbPut("video", { blob: finalBlob, name: f.name || "video.mp4" });
      state.videoUrl = finalUrl;
      if (posterUrl) state.photoUrl = posterUrl;
      const inp = document.getElementById("inVideoUrl"); if (inp) inp.value = f.name || "本機影片";
      const del = document.getElementById("btnDelVideo"); if (del) del.style.display = "inline-flex";
      if (!["video", "full", "side"].includes(state.style)) {
        state.style = "video";
        syncCssVars();
      }
      renderPreview();
      setVidProgress(100, "影片已更新完成", 1200);
      toast("影片已更新並存於手機");
    };
    const v = document.createElement("video");
    v.preload = "auto"; v.muted = true; v.playsInline = true;
    const fallback = setTimeout(() => finishApply(safeBlob, ""), 2000);
    v.onloadeddata = async () => {
      clearTimeout(fallback);
      if (settled) return;
      const poster = await captureVideoPoster(v);
      const needTrim = (isFinite(v.duration) && v.duration > 10.5) || safeBlob.size > 9.5 * 1024 * 1024;
      if (needTrim) {
        const trimmed = await trimVideoTo10s(v, safeBlob);
        URL.revokeObjectURL(rawUrl);
        await finishApply(trimmed, poster);
      } else {
        URL.revokeObjectURL(rawUrl);
        await finishApply(safeBlob, poster);
      }
    };
    v.onerror = () => { clearTimeout(fallback); finishApply(safeBlob, ""); };
    v.src = rawUrl;
    try { v.load(); } catch (err) {}
  };
  fr.readAsArrayBuffer(f);
  e.target.value = "";
}
function clearVideo() {
  localVideoBlob = null; idbDel("video");
  state.videoUrl = ""; document.getElementById("inVideoUrl").value = "";
  document.getElementById("btnDelVideo").style.display = "none"; renderPreview();
}
function convertYoutube() {
  if (!parseYtId(state.videoUrl)) { toast("請先貼入 YouTube 網址"); return; }
  localVideoBlob = null; idbDel("video");
  setStyle("video"); toast("已套用 YouTube 影片");
}

function blobToDataUrl(blob) {
  return new Promise((res, rej) => { const fr = new FileReader(); fr.onload = () => res(fr.result); fr.onerror = rej; fr.readAsDataURL(blob); });
}
async function uploadLocalAsset(kind, dataUrl) {
  try {
    const r = await fetch(CFG.GAS_API, {
      method: "POST", headers: { "Content-Type": "text/plain;charset=utf-8" },
      body: JSON.stringify({ action: "ecardUploadAsset", publicUpload: true, cardId: currentCardId || "card", kind, dataUrl })
    }).then(x => x.json());
    return (r && r.success && r.url) ? r.url : "";
  } catch (e) { return ""; }
}

/* 儲存 + Telegram 通知 */
async function saveCard(silent) {
  if (!silent && localEditUsed >= 3 && !(profile && profile.donated)) { openDonateModal(); return false; }
  persistLocal();
  const btn = document.getElementById("btnSave");
  btn.disabled = true; btn.textContent = "儲存中";
  try {
    const publishCfg = Object.assign({}, state);
    if (publishCfg.logoUrl && publishCfg.logoUrl.startsWith("data:image/")) {
      const u = await uploadLocalAsset("logo", publishCfg.logoUrl);
      if (u) { publishCfg.logoUrl = u; state.logoUrl = u; }
    }
    if (publishCfg.photoUrl && (publishCfg.photoUrl.startsWith("data:image/") || publishCfg.photoUrl.startsWith("blob:"))) {
      const photoData = publishCfg.photoUrl.startsWith("blob:") ? await fetch(publishCfg.photoUrl).then(x => x.blob()).then(blobToDataUrl) : publishCfg.photoUrl;
      const u = await uploadLocalAsset("photo", photoData);
      if (u) { publishCfg.photoUrl = u; state.photoUrl = u; }
    }
    if (publishCfg.videoUrl && publishCfg.videoUrl.startsWith("blob:") && localVideoBlob) {
      setVidProgress(40, "上傳影片至雲端...");
      const dataUrl = await blobToDataUrl(localVideoBlob);
      setVidProgress(75, "同步影片連結...");
      const u = await uploadLocalAsset("video", dataUrl);
      if (u) { publishCfg.videoUrl = u; state.videoUrl = u; }
      setVidProgress(100, "雲端同步完成", 900);
    }
    if (!silent) {
      localEditUsed++;
      localStorage.setItem("ck_local_edit_used", String(localEditUsed));
    }
    const r = await fetch(CFG.GAS_API, {
      method: "POST", headers: { "Content-Type": "text/plain;charset=utf-8" },
      body: JSON.stringify({ action: "ecardNotifyCreate", cardId: (profile && profile.slug) || currentCardId || "", userEmail: (session && session.user && session.user.email) || "", config: publishCfg })
    }).then(x => x.json());
    if (r && r.success && r.cardId) {
      currentCardId = r.cardId;
      localStorage.setItem("ck_my_card_id", currentCardId);
    }
    dirtySinceSave = false;
    persistLocal();
    dirtySinceSave = false;
    if (!silent) toast("已儲存");
    return true;
  } catch (e) {
    if (!silent) toast("已存於本機");
    return false;
  } finally {
    btn.disabled = false; btn.textContent = "儲存";
  }
}

function openAuthModal() { document.getElementById("authModal").style.display = "flex"; }
function closeAuthModal() { document.getElementById("authModal").style.display = "none"; }
function openDonateModal() { document.getElementById("donateModal").style.display = "flex"; }
function closeDonateModal() { document.getElementById("donateModal").style.display = "none"; }
function setAuthMode(m) {
  authMode = m;
  document.getElementById("tabLogin").classList.toggle("active", m === "login");
  document.getElementById("tabReg").classList.toggle("active", m === "register");
  document.getElementById("btnAuthGo").textContent = m === "register" ? "註冊" : "登入";
}
async function submitAuth() {
  if (!sb) return;
  const email = document.getElementById("authEmail").value.trim(), password = document.getElementById("authPass").value;
  if (!email || !password) return;
  const res = authMode === "register" ? await sb.auth.signUp({ email, password }) : await sb.auth.signInWithPassword({ email, password });
  if (res.error) { toast(res.error.message); return; }
  closeAuthModal(); toast(authMode === "register" ? "註冊成功" : "已登入");
}

function toggleChatTheme() {
  const s = document.getElementById("phoneScreen"), d = s.classList.toggle("dark-chat");
  document.getElementById("btnTheme").innerHTML = d
    ? '<svg width="17" height="17" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2" stroke-linecap="round"><path d="M21 12.79A9 9 0 1 1 11.21 3 7 7 0 0 0 21 12.79z"/></svg>'
    : '<svg width="17" height="17" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2" stroke-linecap="round"><circle cx="12" cy="12" r="4"/><path d="M12 2v2M12 20v2M4.93 4.93l1.41 1.41M17.66 17.66l1.41 1.41M2 12h2M20 12h2M6.34 17.66l-1.41 1.41M19.07 4.93l-1.41 1.41"/></svg>';
}

async function shareToLine() {
  if (dirtySinceSave || !currentCardId || (state.videoUrl && state.videoUrl.startsWith("blob:")) || (state.logoUrl && state.logoUrl.startsWith("data:"))) {
    toast("同步最新名片中...");
    await saveCard(true);
  }
  const slug = (profile && profile.slug) || currentCardId || "bigt";
  const url = `https://liff.line.me/${CFG.LIFF_ID}?mode=card&id=${encodeURIComponent(slug)}`;
  if (/iPhone|iPad|Android|Line/i.test(navigator.userAgent)) {
    location.href = url;
  } else {
    window.open(url, "_blank", "noopener");
  }
}

async function loadPreviewParamIfAny() {
  const pid = new URLSearchParams(location.search).get("preview");
  if (!pid) return;
  try {
    const r = await fetch(CFG.GAS_API + "?ac=ecardGet&id=" + encodeURIComponent(pid)).then(x => x.json());
    if (r && r.success && r.config) {
      state = Object.assign(defaultState(), r.config);
      currentCardId = pid; syncCssVars(); renderSocialControls(); renderPreview();
    }
  } catch (e) {}
}

let tTimer;
function toast(msg) {
  const el = document.getElementById("toast"); el.textContent = msg; el.classList.add("show");
  clearTimeout(tTimer); tTimer = setTimeout(() => el.classList.remove("show"), 2000);
}

syncCssVars();
renderSocialControls();
renderPreview();
restoreLocalMedia();
loadPreviewParamIfAny();
</script>
