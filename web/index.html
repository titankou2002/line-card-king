<style>
  :root {
    --bg: #f6f4ef;
    --surface: #fffdf9;
    --raised: #eeeae2;
    --border: rgba(31, 27, 22, 0.11);
    --t1: #1f1b16;
    --t2: #5e554a;
    --t3: #7b7266;
    --accent: #c5ae6e;
    --accent-text: #1f1b16;
    --head-bg: #23201b;
    --body-bg: #23201b;
    --foot-bg: #23201b;
    --btn2-bg: #332e27;
    --card-fg: #f1ece2;
    --card-font: "Microsoft JhengHei", "微軟正黑體", sans-serif;
    --line-green: #06c755;
    --chat-bg-light: #8cabd9;
    --chat-bg-dark: #111315;
    --err: #b4412f;
  }

  * { box-sizing: border-box; margin: 0; padding: 0; }
  html, body { overflow-x: hidden; width: 100%; max-width: 100vw; }
  body {
    font-family: "Microsoft JhengHei", "微軟正黑體", sans-serif;
    background: var(--bg);
    color: var(--t1);
    min-height: 100vh;
  }

  /* 頂部列 */
  .topbar {
    position: sticky; top: 0; z-index: 30;
    background: rgba(255, 253, 249, 0.96);
    border-bottom: 1px solid var(--border);
    padding: 8px 10px;
    display: flex; align-items: center; justify-content: space-between; gap: 6px;
  }
  .topbar-title { display: flex; align-items: center; gap: 6px; min-width: 0; }
  .topbar h1 { font-size: 14px; font-weight: 700; white-space: nowrap; }
  .toolbar { display: flex; align-items: center; gap: 5px; flex-shrink: 0; }

  .btn {
    appearance: none; border: 1px solid var(--border); background: var(--surface);
    color: var(--t1); font-size: 13px; font-weight: 600; padding: 7px 13px;
    border-radius: 8px; cursor: pointer; display: inline-flex; align-items: center;
    justify-content: center; gap: 5px; text-decoration: none; font-family: inherit; white-space: nowrap;
  }
  .btn:hover { background: var(--raised); }
  .btn:disabled { opacity: 0.45; cursor: not-allowed; }
  .btn-pri { background: #23201b; border-color: #23201b; color: #fff; }
  .btn-line { background: var(--line-green); border-color: var(--line-green); color: #fff; font-weight: 700; }
  .btn-line:hover { background: #05b34c; }
  .btn-danger { color: var(--err); border-color: rgba(180,65,47,0.3); }
  .btn-sm { padding: 5px 10px; font-size: 12px; border-radius: 7px; }

  .icon-btn {
    appearance: none; width: 32px; height: 32px; border-radius: 8px;
    border: 1px solid var(--border); background: var(--surface); color: var(--t1);
    display: inline-flex; align-items: center; justify-content: center; cursor: pointer; flex-shrink: 0;
  }
  .icon-btn:hover { background: var(--raised); }
  .icon-btn.acct-ico { border-radius: 999px; background: #23201b; border-color: #23201b; color: #e2ca88; font-size: 13px; font-weight: 700; }

  /* 單欄精簡置中工作台（手機與電腦皆零來回捲動） */
  .studio {
    max-width: 480px;
    width: 100%;
    margin: 0 auto;
    padding: 12px 12px 48px;
    display: flex;
    flex-direction: column;
    gap: 10px;
  }

  /* 管理員多張名片切換列（僅管理員可見，一般用戶完全隱藏） */
  .admin-bar {
    display: none; align-items: center; gap: 6px; width: 100%;
    background: #23201b; border-radius: 11px; padding: 7px 9px; color: #e2ca88;
  }
  .admin-bar select {
    flex: 1; min-width: 0; height: 32px; border-radius: 7px; border: 1px solid rgba(226,202,136,0.35);
    background: #312d26; color: #fff; font-family: inherit; font-size: 12.5px; font-weight: 600; padding: 0 8px;
  }
  .admin-bar .abtn {
    appearance: none; border: 1px solid rgba(226,202,136,0.45); background: #312d26; color: #e2ca88;
    height: 32px; padding: 0 10px; border-radius: 7px; font-size: 12px; font-weight: 700;
    cursor: pointer; font-family: inherit; white-space: nowrap; flex-shrink: 0;
  }
  .admin-bar .abtn.pri { background: #c5ae6e; border-color: #c5ae6e; color: #1f1b16; }

  /* 版面大分類：影片版 / 圖片版 */
  .cat-bar {
    display: grid; grid-template-columns: 1fr 1fr; gap: 6px;
    background: var(--raised); padding: 4px; border-radius: 11px; width: 100%;
  }
  .cat-btn {
    appearance: none; border: none; background: transparent; color: var(--t2);
    font-family: inherit; font-size: 13px; font-weight: 700; padding: 7px 8px;
    border-radius: 8px; cursor: pointer; display: inline-flex; align-items: center; justify-content: center; gap: 6px;
  }
  .cat-btn.active { background: #23201b; color: #e2ca88; box-shadow: 0 2px 8px rgba(0,0,0,0.12); }

  /* 頂部快選條：拍名片 + 橫滑版型 */
  .top-strip {
    display: flex; align-items: center; gap: 8px; width: 100%;
  }
  .style-bar {
    display: flex; overflow-x: auto; flex-wrap: nowrap; gap: 6px; width: 100%;
    padding: 2px 0; -webkit-overflow-scrolling: touch;
  }
  .style-bar::-webkit-scrollbar { display: none; }
  .style-opt {
    flex: 0 0 auto; border: 1.5px solid var(--border); border-radius: 999px;
    padding: 6px 13px; background: var(--surface); cursor: pointer;
    font-family: inherit; font-size: 12.5px; font-weight: 700; color: var(--t1); white-space: nowrap;
  }
  .style-opt.active { border-color: #23201b; background: #23201b; color: #e2ca88; }

  /* 預覽舞台 */
  .canvas-stage {
    border-radius: 18px;
    background: var(--chat-bg-light);
    padding: 14px 12px 16px;
    display: flex; flex-direction: column; align-items: center; gap: 10px;
    transition: background 0.2s;
  }
  .canvas-stage.dark-chat { background: var(--chat-bg-dark); }

  /* 所見即所得單張名片（鎖定 LINE mega 真實 300px 寬度） */
  .mega-card {
    width: 100%; max-width: 300px; border-radius: 18px; overflow: hidden;
    box-shadow: 0 12px 32px rgba(0,0,0,0.22);
    font-family: var(--card-font);
    background: var(--body-bg);
    color: var(--card-fg);
  }
  .mega-card.style-frame { border: 3px solid var(--card-fg); border-radius: 12px; }
  .mc-top-bar { height: 5px; background: var(--accent); }
  .mc-head-area { background: var(--head-bg); }
  .mc-body { padding: 12px 18px; display: flex; flex-direction: column; gap: 7px; background: var(--body-bg); }
  .mc-foot { padding: 6px 18px 14px; display: flex; flex-direction: column; gap: 8px; background: var(--foot-bg); }

  /* 行內直接點字編輯樣式（使用原生 input，手機/電腦 100% 支援原生全選） */
  .ed-wrap { display: inline-flex; align-items: center; gap: 4px; max-width: 100%; }
  .ed-wrap-full { display: flex; align-items: center; gap: 4px; width: 100%; }
  .mc-inp {
    appearance: none; -webkit-appearance: none; border: none; outline: none; background: transparent;
    color: inherit; font-family: inherit; font-size: inherit; font-weight: inherit; line-height: inherit;
    padding: 1px 3px; margin: 0; border-radius: 4px; min-width: 24px; max-width: 100%;
    field-sizing: content; -webkit-user-select: text; user-select: text;
    transition: background 0.12s, box-shadow 0.12s; cursor: text;
  }
  .mc-inp:not([readonly]):hover { background: rgba(197, 174, 110, 0.14); }
  .mc-inp:not([readonly]):focus { background: rgba(197, 174, 110, 0.22); box-shadow: 0 0 0 1.5px var(--accent); }
  .mc-inp[readonly] { cursor: default; }
  .mc-inp-full { width: 100%; flex: 1; min-width: 0; }

  .del-x {
    appearance: none; border: none; background: rgba(128,128,128,0.28); color: inherit;
    width: 16px; height: 16px; border-radius: 999px; font-size: 10px; line-height: 1;
    display: inline-flex; align-items: center; justify-content: center; cursor: pointer;
    flex-shrink: 0; opacity: 0.65;
  }
  .del-x:hover { opacity: 1; background: var(--err); color: #fff; }
  .clean-view .del-x, .clean-view .add-row-inline { display: none !important; }

  .add-row-inline {
    appearance: none; border: 1px dashed rgba(197,174,110,0.45); background: transparent;
    color: var(--accent); font-size: 11.5px; font-weight: 700; padding: 4px 10px;
    border-radius: 6px; cursor: pointer; align-self: flex-start; margin-top: 2px; font-family: inherit;
  }

  .color-pick-mode [data-cslot] { cursor: crosshair !important; }
  .color-pick-mode [data-cslot]:hover { outline: 2px dashed var(--accent); outline-offset: -2px; }

  .mc-brand-row { display: flex; align-items: center; justify-content: space-between; gap: 8px; margin-bottom: 8px; }
  .mc-logo { height: var(--logo-h, 32px); color: var(--accent); flex-shrink: 0; display: inline-flex; align-items: center; cursor: pointer; }
  .mc-logo img { height: var(--logo-h, 32px); width: auto; max-width: 180px; object-fit: contain; display: block; }
  .mc-co-name { font-size: 11.5px; font-weight: 600; opacity: 0.85; color: var(--co-col, inherit); }
  .mc-name-line { display: flex; align-items: baseline; flex-wrap: wrap; gap: 6px; }
  .mc-name { font-size: 21px; font-weight: 700; line-height: 1.25; color: var(--name-col, inherit); }
  .mc-en-name { font-size: 15px; font-weight: 700; color: var(--en-col, var(--accent)); }
  .mc-slogan { font-size: 12px; opacity: 0.85; margin-top: 5px; line-height: 1.4; color: var(--slogan-col, inherit); }
  .mc-sep { height: 1px; background: var(--sep-col, currentColor); opacity: var(--sep-op, 0.14); margin: 0 18px; }

  .mc-row { display: flex; align-items: center; gap: 8px; font-size: 12.5px; line-height: 1.4; }
  .mc-lbl { min-width: 34px; flex-shrink: 0; color: var(--row-ico-col, var(--accent)); font-size: 11.5px; font-weight: 700; }
  .mc-lbl-ico { width: 18px; height: 18px; flex-shrink: 0; color: var(--row-ico-col, var(--accent)); display: inline-flex; align-items: center; justify-content: center; cursor: pointer; }
  .mc-val { flex: 1; min-width: 0; word-break: break-word; color: var(--row-val-col, inherit); }
  .mc-row-tools { display: flex; flex-wrap: wrap; gap: 6px; margin-top: 2px; }
  .clean-view .mc-row-tools { display: none !important; }

  .mc-btn-link {
    height: 22px; background: transparent; border: none; color: var(--share-col, var(--accent));
    font-size: 11px; font-weight: 600; opacity: 0.82; letter-spacing: 0.04em; cursor: pointer; font-family: inherit;
  }

  /* 10 顆自適應寬度可拖曳快捷按鈕（依數量自動填滿卡片寬度） */
  .mc-action-grid { display: flex; flex-direction: column; gap: 7px; padding: 4px 0 2px; width: 100%; }
  .mc-icon-row { display: flex; justify-content: center; gap: 7px; width: 100%; }
  .mc-icon-chip {
    flex: 1 1 0; min-width: 0; max-width: 112px; height: 50px; border-radius: 11px;
    background: var(--btn2-bg); border: 1px solid var(--btn-bd-col, rgba(197,174,110,0.36));
    color: var(--btn-ico-col, var(--accent)); display: inline-flex; flex-direction: column; align-items: center; justify-content: center; gap: 3px;
    text-decoration: none; cursor: grab; user-select: none; -webkit-user-select: none; touch-action: none;
    transition: transform 0.14s, border-color 0.14s, box-shadow 0.14s, opacity 0.14s;
  }
  .clean-view .mc-icon-chip { cursor: pointer; touch-action: auto; }
  .mc-icon-chip.dragging { opacity: 0.45; transform: scale(1.08); cursor: grabbing; }
  .mc-icon-chip.drag-over { border-color: var(--accent); box-shadow: 0 0 0 2px var(--accent); transform: scale(1.06); }
  .mc-icon-lbl { font-size: 10px; font-weight: 700; line-height: 1; letter-spacing: 0.02em; pointer-events: none; }
  .mc-icon-chip svg { pointer-events: none; }
  .mc-media-click { cursor: pointer; }

  .mc-video-box { position: relative; width: 100%; aspect-ratio: 16/9; background: #14120f; overflow: hidden; }
  .mc-video-box video, .mc-video-box img { width: 100%; height: 100%; object-fit: cover; display: block; }
  .mc-yt-play { position: absolute; inset: 0; background: rgba(0,0,0,0.24); display: flex; align-items: center; justify-content: center; }
  .mc-yt-play span { width: 48px; height: 34px; border-radius: 9px; background: rgba(0,0,0,0.72); color: #fff; display: inline-flex; align-items: center; justify-content: center; }
  .mc-photo { width: 60px; height: 74px; border-radius: 10px; overflow: hidden; flex-shrink: 0; border: 1.5px solid var(--accent); }
  .mc-photo img { width: 100%; height: 100%; object-fit: cover; display: block; }
  .mc-hero-box { position: relative; height: 176px; background: #2c2822; overflow: hidden; }
  .mc-hero-img { width: 100%; height: 100%; object-fit: cover; display: block; }
  .mc-hero-grad { position: absolute; inset: 0; background: linear-gradient(180deg, rgba(20,18,15,0.12) 0%, rgba(20,18,15,0.2) 40%, rgba(20,18,15,0.88) 100%); display: flex; flex-direction: column; justify-content: space-between; padding: 12px 16px; }
  .mc-logo-pill { background: rgba(255,253,249,0.92); padding: 4px 8px; border-radius: 6px; display: inline-flex; }
  .mc-logo-pill img { height: 16px; width: auto; max-width: 100px; display: block; }
  /* 側邊滿版長向影像版型（左 36%：右 64%，與 LINE 實際比例 1:1 對齊） */
  .mc-side-full { display: grid; grid-template-columns: 36% minmax(0, 1fr); align-items: stretch; min-height: 330px; }
  .mc-side-media { position: relative; background: #14120f; overflow: hidden; height: 100%; }
  .mc-side-media img, .mc-side-media video { position: absolute; inset: 0; width: 100%; height: 100%; object-fit: cover; display: block; }
  .mc-side-col { display: flex; flex-direction: column; min-width: 0; background: var(--body-bg); }
  .mc-side-head { padding: 14px 12px 10px; display: flex; flex-direction: column; gap: 4px; background: var(--head-bg); }
  .mc-side-full .mc-name { font-size: 18px; }
  .mc-side-full .mc-en-name { font-size: 13px; }
  .mc-side-full .mc-co-name { font-size: 11px; }
  .mc-side-full .mc-slogan { font-size: 11px; margin-top: 2px; }
  .mc-side-full .mc-sep { margin: 0 12px; }
  .mc-side-full .mc-body { padding: 10px 12px; gap: 5px; flex: 1; }
  .mc-side-full .mc-row { font-size: 11.5px; gap: 5px; }
  .mc-side-full .mc-lbl { min-width: 28px; font-size: 10.5px; }
  .mc-side-full .mc-foot { padding: 4px 10px 12px; gap: 6px; }
  .mc-side-full .mc-icon-row { gap: 5px; }
  .mc-side-full .mc-icon-chip { flex: 1 1 0; min-width: 0; max-width: 72px; width: auto; height: 42px; border-radius: 9px; gap: 2px; }
  .mc-side-full .mc-icon-chip svg { width: 15px; height: 15px; }
  .mc-side-full .mc-icon-lbl { font-size: 8.5px; }

  .mc-block-top { padding: 16px 18px 14px; color: #FFFFFF; }
  .mc-block-top .mc-en-name { color: #F5E6C4; }

  /* 點擊按鈕時浮出的極簡單行編輯條 */
  .inline-bar {
    display: none; width: 100%; max-width: 100%; box-sizing: border-box;
    background: var(--surface); border: 1px solid var(--border); border-radius: 12px;
    padding: 7px 8px; gap: 6px; align-items: center; box-shadow: 0 6px 20px rgba(0,0,0,0.12);
    overflow: hidden;
  }
  .inline-bar input {
    flex: 1 1 0; width: 0; min-width: 0; height: 36px; padding: 0 10px;
    border: 1px solid var(--border); border-radius: 8px; font-size: 16px; font-family: inherit;
    background: #fff;
  }
  .inline-bar .btn { flex-shrink: 0; padding: 0 10px; height: 36px; }

  /* 進階設定收合區 */
  .adv-card {
    background: var(--surface); border: 1px solid var(--border);
    border-radius: 14px; padding: 12px; display: flex; flex-direction: column; gap: 12px;
    width: 100%; min-width: 0; max-width: 100%;
  }
  .dock-tabs {
    display: grid; grid-template-columns: repeat(3, 1fr); gap: 4px;
    background: var(--raised); padding: 4px; border-radius: 9px;
  }
  .dock-tab {
    border: none; background: transparent; padding: 7px 4px; border-radius: 6px;
    font-size: 12.5px; font-weight: 700; color: var(--t2); cursor: pointer; font-family: inherit;
  }
  .dock-tab.active { background: var(--surface); color: var(--t1); }
  .dock-pane { display: none; flex-direction: column; gap: 12px; min-width: 0; }
  .dock-pane.active { display: flex; }

  .slot-tabs { display: flex; flex-wrap: wrap; gap: 4px; background: var(--raised); padding: 3px; border-radius: 8px; }
  .slot-tab { border: none; background: transparent; padding: 4px 9px; border-radius: 6px; font-size: 12px; font-weight: 700; color: var(--t2); cursor: pointer; font-family: inherit; }
  .slot-tab.active { background: var(--surface); color: var(--t1); }

  .color-row { display: flex; align-items: center; gap: 8px; }
  .color-picker-wrap { position: relative; width: 38px; height: 34px; border-radius: 8px; overflow: hidden; border: 1px solid var(--border); flex-shrink: 0; }
  .color-picker-wrap input[type="color"] { position: absolute; inset: -6px; width: 52px; height: 48px; border: none; cursor: pointer; }
  .swatches { display: flex; flex-wrap: wrap; gap: 8px; }
  .swatch { width: 26px; height: 26px; border-radius: 999px; border: 2px solid transparent; cursor: pointer; box-shadow: inset 0 0 0 1px rgba(0,0,0,0.12); }
  .swatch.active { border-color: #1f1b16; }

  .ext-stack { display: flex; flex-direction: column; gap: 7px; }
  .ext-row {
    display: grid; grid-template-columns: 44px 82px minmax(0, 1fr); align-items: center; gap: 6px;
    padding: 6px 8px; background: var(--bg); border: 1px solid var(--border); border-radius: 9px;
  }
  .ext-mv { display: inline-flex; gap: 2px; }
  .ext-mv button {
    appearance: none; border: 1px solid var(--border); background: var(--surface); color: var(--t2);
    width: 20px; height: 26px; border-radius: 5px; font-size: 11px; cursor: pointer;
    display: inline-flex; align-items: center; justify-content: center; padding: 0;
  }
  .ext-mv button:hover { background: var(--raised); color: var(--t1); }
  .ext-chk { display: inline-flex; align-items: center; gap: 5px; font-size: 12px; font-weight: 700; cursor: pointer; white-space: nowrap; }
  .ext-chk input { width: 15px; height: 15px; accent-color: #23201b; }
  .ext-row input[type="text"], .ext-row input[type="email"] {
    height: 32px; padding: 0 9px; border: 1px solid var(--border); border-radius: 7px;
    font-size: 12.5px; background: #fff; font-family: inherit; width: 100%; min-width: 0;
  }

  .modal-bg { display: none; position: fixed; inset: 0; z-index: 200; background: rgba(31,27,22,0.58); align-items: center; justify-content: center; padding: 20px; }
  .modal-card { background: #fffdf9; border-radius: 18px; padding: 24px; max-width: 360px; width: 100%; text-align: center; display: flex; flex-direction: column; gap: 12px; }
  .toast { position: fixed; bottom: 20px; left: 50%; transform: translateX(-50%) translateY(20px); background: #1f1b16; color: #fff; padding: 9px 16px; border-radius: 10px; font-size: 12.5px; opacity: 0; pointer-events: none; transition: 0.2s; z-index: 400; }
  .toast.show { opacity: 1; transform: translateX(-50%) translateY(0); }

  .vid-prog-wrap { display: none; flex-direction: column; gap: 4px; width: 100%; }
  .vid-prog-track { width: 100%; height: 6px; border-radius: 999px; background: var(--raised); overflow: hidden; }

/* 手機本機自動存檔（localStorage + IndexedDB 存影片與高畫質圖檔） */
function openLocalDB() {
  return new Promise((resolve, reject) => {
    if (!window.indexedDB) { reject(new Error("no idb")); return; }
    const req = indexedDB.open("CardKingLocalDB", 1);
    req.onupgradeneeded = () => { if (!req.result.objectStoreNames.contains("media")) req.result.createObjectStore("media"); };
    req.onsuccess = () => resolve(req.result);
    req.onerror = () => reject(req.error);
  });
}
async function idbPut(key, val) {
  try {
    const db = await openLocalDB();
    await new Promise((res, rej) => {
      const tx = db.transaction("media", "readwrite");
      tx.objectStore("media").put(val, key);
      tx.oncomplete = res; tx.onerror = () => rej(tx.error);
    });
  } catch (e) {}
}
async function idbGet(key) {
  try {
    const db = await openLocalDB();
    return await new Promise((res, rej) => {
      const tx = db.transaction("media", "readonly");
      const r = tx.objectStore("media").get(key);
      r.onsuccess = () => res(r.result); r.onerror = () => rej(r.error);
    });
  } catch (e) { return null; }
}
async function idbDel(key) {
  try {
    const db = await openLocalDB();
    await new Promise((res, rej) => {
      const tx = db.transaction("media", "readwrite");
      tx.objectStore("media").delete(key);
      tx.oncomplete = res; tx.onerror = () => rej(tx.error);
    });
  } catch (e) {}
}

let _saveTimer = null;
let dirtySinceSave = false;
function persistLocal() {
  dirtySinceSave = true;
  clearTimeout(_saveTimer);
  _saveTimer = setTimeout(() => {
    try {
      const copy = Object.assign({}, state);
      if (copy.videoUrl && String(copy.videoUrl).startsWith("blob:")) copy.videoUrl = "";
      if (copy.photoUrl && String(copy.photoUrl).startsWith("data:") && copy.photoUrl.length > 350000) copy.photoUrl = "";
      localStorage.setItem("ck_state_v8", JSON.stringify(copy));
    } catch (e) {
      try {
        const slim = Object.assign({}, state, { photoUrl: "", videoUrl: String(state.videoUrl || "").startsWith("blob:") ? "" : state.videoUrl });
        localStorage.setItem("ck_state_v8", JSON.stringify(slim));
      } catch (e2) {}
    }
  }, 120);
}

async function restoreLocalMedia() {
  if (new URLSearchParams(location.search).get("preview")) return;
  let changed = false;
  const savedLogo = await idbGet("rawLogo");
  if (savedLogo) {
    await new Promise(res => {
      const img = new Image();
      img.onload = () => { rawLogoSource = img; reprocessLogoIfLoaded(); changed = true; res(); };
      img.onerror = res;
      img.src = URL.createObjectURL(savedLogo);
    });
  }
  const savedPhoto = await idbGet("photo");
  if (savedPhoto) {
    state.photoUrl = URL.createObjectURL(savedPhoto);
    changed = true;
  }
  const savedVid = await idbGet("video");
  if (savedVid && savedVid.blob) {
    localVideoBlob = savedVid.blob;
    state.videoUrl = URL.createObjectURL(savedVid.blob);
    const inp = document.getElementById("inVideoUrl"); if (inp) inp.value = savedVid.name || "本機影片.mp4";
    const del = document.getElementById("btnDelVideo"); if (del) del.style.display = "inline-flex";
    changed = true;
  }
  if (changed) renderPreview();
}

const DEFAULT_SWATCHES = ["#C5AE6E", "#B59E63", "#5F7464", "#A67C68", "#6E818F", "#23201B", "#FAF7F0"];
let recentSwatches = (function () {
  try { const r = JSON.parse(localStorage.getItem("ck_recent_swatches") || "[]"); return Array.isArray(r) ? r.filter(x => /^#[0-9A-F]{6}$/i.test(x)) : []; } catch (e) { return []; }

function renderSwatches() {
  const cur = (getSlotValue(colorSlot) || "#C5AE6E").toUpperCase();
  const all = DEFAULT_SWATCHES.concat(recentSwatches.filter(h => !DEFAULT_SWATCHES.includes(h.toUpperCase())));
  const el = document.getElementById("swatches");
  if (!el) return;
  el.innerHTML = all.map(h => {
    const u = h.toUpperCase();
    return `<button type="button" class="swatch ${u === cur ? "active" : ""}" style="background:${u}" data-hex="${u}" title="${u}" onclick="applySlotColor('${u}')"></button>`;
  }).join("");
}
function rememberSwatch(hex) {
  if (!/^#[0-9a-fA-F]{6}$/.test(hex || "")) return;
  const u = hex.toUpperCase();
  if (DEFAULT_SWATCHES.includes(u)) return;

function onQuickMediaPick(e) {
  const f = e.target.files && e.target.files[0]; if (!f) return;
  const isVid = (f.type && f.type.startsWith("video/")) || /\.(mp4|mov|m4v|webm|3gp)$/i.test(f.name || "");
  if (isVid) {
    onVideoPick(e);
    return;
  }
  const isImg = (f.type && f.type.startsWith("image/")) || /\.(jpg|jpeg|png|webp|heic|gif)$/i.test(f.name || "");
  if (isImg) {
    const img = new Image();
    img.onload = () => {
      const c = document.createElement("canvas");
      const sc = Math.min(1, 1080 / Math.max(img.naturalWidth, img.naturalHeight));
      c.width = Math.round(img.naturalWidth * sc); c.height = Math.round(img.naturalHeight * sc);
      c.getContext("2d").drawImage(img, 0, 0, c.width, c.height);
      c.toBlob(b => { if (b) idbPut("photo", b); }, "image/jpeg", 0.86);
      state.photoUrl = c.toDataURL("image/jpeg", 0.86);
      state.showPhoto = true;
      localVideoBlob = null; idbDel("video");

      const chk = document.getElementById("chkPhoto"); if (chk) chk.checked = true;
      renderPreview();
      toast("圖片已更新並存於手機");

    img.src = URL.createObjectURL(f);
  }
  e.target.value = "";
}

function splitBalancedRows(list, isSide) {
  const n = list.length;
  if (!n) return [];
  if (isSide) {
    const out = [];
    for (let i = 0; i < n; i += 3) out.push(list.slice(i, i + 3));
    return out;
  }
  if (n <= 5) return [list];
  const first = n <= 6 ? 3 : (n <= 8 ? 4 : 5);
  return [list.slice(0, first), list.slice(first)];
}

function bindActionDrag(mount) {
  const chips = mount.querySelectorAll(".mc-icon-chip[data-akey]");
  chips.forEach(chip => {
    chip.addEventListener("pointerdown", (e) => {
      if (cleanView) return;
      if (e.button && e.button !== 0) return;
      const dragKey = chip.dataset.akey;
      const sx = e.clientX, sy = e.clientY;
      let dragging = false;
      let overKey = "";
      try { chip.setPointerCapture(e.pointerId); } catch (err) {}

      const clearOver = () => mount.querySelectorAll(".mc-icon-chip.drag-over").forEach(x => x.classList.remove("drag-over"));
      const onMove = (ev) => {
        if (!dragging && Math.hypot(ev.clientX - sx, ev.clientY - sy) > 8) {
          dragging = true;
          chip.classList.add("dragging");
        }
        if (!dragging) return;
        clearOver();
        chip.style.pointerEvents = "none";
        const hit = document.elementFromPoint(ev.clientX, ev.clientY);
        chip.style.pointerEvents = "";
        const target = hit && hit.closest ? hit.closest(".mc-icon-chip[data-akey]") : null;
        if (target && target.dataset.akey !== dragKey) {
          target.classList.add("drag-over");
          overKey = target.dataset.akey;
        } else {
          overKey = "";
        }
      };
      const onUp = () => {
        chip.classList.remove("dragging");
        clearOver();
        chip.removeEventListener("pointermove", onMove);
        chip.removeEventListener("pointerup", onUp);
        chip.removeEventListener("pointercancel", onUp);
        if (dragging && overKey && overKey !== dragKey) {
          const ord = ensureActionOrder();
          const from = ord.indexOf(dragKey), to = ord.indexOf(overKey);
          if (from >= 0 && to >= 0) {
            ord.splice(from, 1);
            ord.splice(to, 0, dragKey);
            state.actionOrder = ord;
            renderSocialControls();
            renderPreview();
          }
        } else if (!dragging) {
          openActionEditor(dragKey);
        }
      };
      chip.addEventListener("pointermove", onMove);
      chip.addEventListener("pointerup", onUp);
      chip.addEventListener("pointercancel", onUp);
    });
  });
}

/* Logo 自動去背 + 自動裁掉空白邊界 + 純色處理 */
function processLogoCanvas(src, opts) {
  const sw = src.naturalWidth || src.width, sh = src.naturalHeight || src.height;
  if (!sw || !sh) return "";
  const sc = Math.min(1, 640 / Math.max(sw, sh));
  const w = Math.max(1, Math.round(sw * sc)), h = Math.max(1, Math.round(sh * sc));
  const c = document.createElement("canvas");
  c.width = w; c.height = h;
  const ctx = c.getContext("2d");
  ctx.drawImage(src, 0, 0, w, h);

  const imgData = ctx.getImageData(0, 0, w, h);
  const px = imgData.data;
  const corners = [0, (w - 1) * 4, ((h - 1) * w) * 4, ((h - 1) * w + (w - 1)) * 4];
  const transparentCorners = corners.filter(idx => px[idx + 3] < 128).length;

  if (opts.removeBg && transparentCorners < 2) {
    let br = 0, bg = 0, bb = 0;
    corners.forEach(idx => { br += px[idx]; bg += px[idx + 1]; bb += px[idx + 2]; });
    br /= 4; bg /= 4; bb /= 4;
    for (let i = 0; i < px.length; i += 4) {
      if (px[i + 3] === 0) continue;
      const dist = Math.hypot(px[i] - br, px[i + 1] - bg, px[i + 2] - bb);
      if (dist < 38) px[i + 3] = 0;
      else if (dist < 76) px[i + 3] = Math.round(((dist - 38) / 38) * px[i + 3]);
    }
  }

  if (opts.mono && opts.accentHex) {
    const hc = opts.accentHex.replace("#", "");
    const ar = parseInt(hc.slice(0, 2), 16), ag = parseInt(hc.slice(2, 4), 16), ab = parseInt(hc.slice(4, 6), 16);
    for (let i = 0; i < px.length; i += 4) {
      if (px[i + 3] > 0) { px[i] = ar; px[i + 1] = ag; px[i + 2] = ab; }
    }
  }
  ctx.putImageData(imgData, 0, 0);

  // 自動緊密裁切透明白邊，避免文字 Logo 在白框裡縮成一小點
  let minX = w, minY = h, maxX = -1, maxY = -1;
  for (let y = 0; y < h; y++) {
    for (let x = 0; x < w; x++) {
      if (px[(y * w + x) * 4 + 3] > 18) {
        if (x < minX) minX = x;
        if (x > maxX) maxX = x;
        if (y < minY) minY = y;
        if (y > maxY) maxY = y;
      }
    }
  }
  if (maxX >= minX && maxY >= minY) {
    const pad = 4;
    const tw = (maxX - minX + 1) + pad * 2, th = (maxY - minY + 1) + pad * 2;
    const out = document.createElement("canvas");
    out.width = tw; out.height = th;
    out.getContext("2d").drawImage(c, minX, minY, maxX - minX + 1, maxY - minY + 1, pad, pad, maxX - minX + 1, maxY - minY + 1);
    return out.toDataURL("image/png");
  }
  return c.toDataURL("image/png");
}

/* 拍名片 AI 辨識 + 自動去背裁切 Logo */
function cropLogoFromCard(img, box) {
  if (!Array.isArray(box) || box.length !== 4) return "";
  let [ymin, xmin, ymax, xmax] = box.map(Number);
  if ([ymin, xmin, ymax, xmax].some(isNaN) || ymax <= ymin || xmax <= xmin) return "";
  const iw = img.naturalWidth, ih = img.naturalHeight;
  const padX = (xmax - xmin) * 0.04, padY = (ymax - ymin) * 0.04;
  const sx = Math.max(0, Math.round(((xmin - padX) / 1000) * iw));
  const sy = Math.max(0, Math.round(((ymin - padY) / 1000) * ih));
  const sw = Math.min(iw - sx, Math.max(10, Math.round(((xmax - xmin + padX * 2) / 1000) * iw)));
  const sh = Math.min(ih - sy, Math.max(10, Math.round(((ymax - ymin + padY * 2) / 1000) * ih)));
  const c = document.createElement("canvas");
  c.width = sw; c.height = sh;
  c.getContext("2d").drawImage(img, sx, sy, sw, sh, 0, 0, sw, sh);
  rawLogoSource = c;
  c.toBlob(b => { if (b) idbPut("rawLogo", b); }, "image/png");
  return processLogoCanvas(c, { removeBg: state.logoRemoveBg !== false, mono: state.logoMono !== false, accentHex: state.color });
}

function compute16x9Crop(vw, vh, vPosPct, vZoomPct, vPosXPct, customAspect) {
  const dstAspect = customAspect || (16 / 9);
  const zoom = Math.max(1, Math.min(2.2, (Number(vZoomPct) || 100) / 100));
  const posX = Math.max(0, Math.min(100, Number(vPosXPct ?? state.videoPosX ?? 50))) / 100;
  const posY = Math.max(0, Math.min(100, Number(vPosPct ?? 50))) / 100;
  let baseW = vw, baseH = vh;
  if (vw / vh < dstAspect) { baseH = vw / dstAspect; }
  else { baseW = vh * dstAspect; }
  const sw = Math.max(2, Math.round(baseW / zoom));
  const sh = Math.max(2, Math.round(baseH / zoom));
  const sx = Math.max(0, Math.min(vw - sw, Math.round(posX * (vw - sw))));
  const sy = Math.max(0, Math.min(vh - sh, Math.round(posY * (vh - sh))));
  return { sx, sy, sw, sh };
}

/* 從影片自動擷取 16:9 橫式封面縮圖（符合使用者拉選的上下與縮放） */
async function captureVideoPoster(videoEl) {
  try {
    const vw = videoEl.videoWidth || 720, vh = videoEl.videoHeight || 405;
    if (!vw || !vh) return "";
    if (videoEl.currentTime < 0.15 && (!isFinite(videoEl.duration) || videoEl.duration > 0.3)) {
      await new Promise(res => {
        const done = () => { videoEl.removeEventListener("seeked", done); res(); };
        videoEl.addEventListener("seeked", done);
        setTimeout(done, 500);
        try { videoEl.currentTime = 0.2; } catch (e) { done(); }
      });
    }
    const { sx, sy, sw, sh } = compute16x9Crop(vw, vh, state.videoPos ?? 50, state.videoZoom || 100);
    const c = document.createElement("canvas");
    c.width = 720; c.height = 405;
    c.getContext("2d").drawImage(videoEl, sx, sy, sw, sh, 0, 0, 720, 405);
    const dataUrl = c.toDataURL("image/jpeg", 0.85);
    c.toBlob(b => { if (b) idbPut("photo", b); }, "image/jpeg", 0.85);
    return dataUrl;
  } catch (e) { return ""; }
}

function trimVideoTo10s(videoEl, fallbackBlob, startSec, vPosPct, vZoomPct) {
  return new Promise(async (resolve) => {
    try {
      const vw = videoEl.videoWidth || 720, vh = videoEl.videoHeight || 405;
      // 強制輸出 16:9 橫式滿版畫面（720x405），直式影片也不會有左右灰邊
      const targetW = 720, targetH = 406;
      const c = document.createElement("canvas");
      c.width = targetW; c.height = targetH;
      const ctx = c.getContext("2d");
      const { sx, sy, sw, sh } = compute16x9Crop(vw, vh, vPosPct ?? 50, vZoomPct || 100);
      if (typeof c.captureStream !== "function" || typeof MediaRecorder === "undefined") {
        resolve(fallbackBlob);
        return;
      }
      const stream = c.captureStream(24);
      const mimeType = ["video/mp4;codecs=avc1", "video/mp4", "video/webm;codecs=vp8", "video/webm"].find(t => {
        try { return MediaRecorder.isTypeSupported(t); } catch (e) { return false; }
      }) || "";
      const rec = mimeType ? new MediaRecorder(stream, { mimeType, videoBitsPerSecond: 1800000 }) : new MediaRecorder(stream, { videoBitsPerSecond: 1800000 });
      const chunks = [];
      rec.ondataavailable = (ev) => { if (ev.data && ev.data.size > 0) chunks.push(ev.data); };
      rec.onstop = () => {
        const out = chunks.length ? new Blob(chunks, { type: mimeType.split(";")[0] || "video/mp4" }) : fallbackBlob;
        resolve(out.size > 0 ? out : fallbackBlob);
      };
      videoEl.muted = true;
      await new Promise(res => {
        const done = () => { videoEl.removeEventListener("seeked", done); res(); };
        videoEl.addEventListener("seeked", done);
        setTimeout(done, 500);
        try { videoEl.currentTime = startSec || 0; } catch (e) { done(); }
      });
      await videoEl.play();
      rec.start(250);
      const startAt = performance.now();
      const remain = Math.max(1, (videoEl.duration || 10) - (startSec || 0));
      const targetMs = Math.min(10000, remain * 1000);
      let rafId = 0;
      const tick = () => {
        const elapsed = performance.now() - startAt;
        try { ctx.drawImage(videoEl, sx, sy, sw, sh, 0, 0, targetW, targetH); } catch (e) {}
        setVidProgress(15 + Math.min(78, (elapsed / targetMs) * 78), "轉成橫式 16:9 影片中...");
        if (elapsed >= targetMs || videoEl.ended) {
          cancelAnimationFrame(rafId);
          videoEl.pause();
          if (rec.state !== "inactive") rec.stop();
          return;
        }
        rafId = requestAnimationFrame(tick);
      };
      rafId = requestAnimationFrame(tick);
    } catch (e) {
      resolve(fallbackBlob);
    }
  });
}

async function applyVideoTrim() {
  // 圖片版：將目前調整的左右/上下/縮放直接裁切成最終照片（LINE 同步呈現）
  if (!VIDEO_STYLES.includes(state.style)) {
    if (!state.photoUrl) { closeVidTrimBar(); return; }
    const btn = document.getElementById("btnApplyTrim");
    if (btn) { btn.disabled = true; btn.textContent = "套用中..."; }
    try {
      const img = new Image();
      img.crossOrigin = "anonymous";
      await new Promise((res, rej) => { img.onload = res; img.onerror = rej; img.src = state.photoUrl; });
      const aspect = state.style === "side" ? (1 / 3) : (state.style === "hero" ? (16 / 10) : (60 / 74));
      const { sx, sy, sw, sh } = compute16x9Crop(img.naturalWidth, img.naturalHeight, state.videoPos ?? 50, state.videoZoom || 100, state.videoPosX ?? 50, aspect);
      const outW = state.style === "side" ? 360 : (state.style === "hero" ? 960 : 480);
      const outH = Math.round(outW / aspect);
      const c = document.createElement("canvas");
      c.width = outW; c.height = outH;
      c.getContext("2d").drawImage(img, sx, sy, sw, sh, 0, 0, outW, outH);
      c.toBlob(b => { if (b) idbPut("photo", b); }, "image/jpeg", 0.88);
      state.photoUrl = c.toDataURL("image/jpeg", 0.88);
      state.videoPosX = 50; state.videoPos = 50; state.videoZoom = 100;
      renderPreview();
      closeVidTrimBar();
      toast("已套用圖片裁切位置");
    } catch (e) {
      closeVidTrimBar();
      toast("已套用目前畫面位置");
    } finally {
      if (btn) { btn.disabled = false; btn.textContent = "套用目前位置"; }
    }
    return;
  }
  const srcBlob = rawPickedVideoBlob || localVideoBlob;
  if (!srcBlob) { closeVidTrimBar(); return; }
  const btn = document.getElementById("btnApplyTrim");
  if (btn) { btn.disabled = true; btn.textContent = "轉檔中..."; }
  setVidProgress(10, "套用橫式 16:9 裁切...");
  try {
    const tmpUrl = URL.createObjectURL(srcBlob);
    const v = document.createElement("video");
    v.preload = "auto"; v.muted = true; v.playsInline = true; v.src = tmpUrl;
    await new Promise(res => {
      v.onloadeddata = res; v.onerror = res; setTimeout(res, 2000);
      try { v.load(); } catch (e) {}
    });
    try { v.currentTime = trimStartSec || 0.2; } catch (e) {}
    const poster = await captureVideoPoster(v);
    const vw = v.videoWidth || 720, vh = v.videoHeight || 405;
    const isPortrait = (vw / vh) < 1.5;
    let finalBlob = srcBlob;
    if (isPortrait || rawVideoDuration > 10.5 || srcBlob.size > 9.5 * 1024 * 1024 || Number(state.videoPosX ?? 50) !== 50 || Number(state.videoPos ?? 50) !== 50 || Number(state.videoZoom || 100) !== 100) {
      finalBlob = await trimVideoTo10s(v, srcBlob, trimStartSec, state.videoPos ?? 50, state.videoZoom || 100);
      state.videoPosX = 50;
      state.videoPos = 50;
      state.videoZoom = 100;
    }
    URL.revokeObjectURL(tmpUrl);
    localVideoBlob = finalBlob;
    await idbPut("video", { blob: finalBlob, name: rawPickedVideoName });
    state.videoUrl = URL.createObjectURL(finalBlob);
    if (poster) state.photoUrl = poster;
    renderPreview();
    setVidProgress(100, "已轉成橫式影片", 1000);
    closeVidTrimBar();
    toast("已套用橫式 16:9 影片");
  } catch (e) {
    setVidProgress(null);
    toast("已套用目前畫面位置");
    closeVidTrimBar();
  } finally {
    if (btn) { btn.disabled = false; btn.textContent = "套用目前位置"; }
  }
}

/* 立即載入 MP4/MOV，不卡 FileReader，不提早清空 input */
function onVideoPick(e) {
  const input = e.target;
  const f = input.files && input.files[0]; if (!f) return;
  if (f.size > 60 * 1024 * 1024) {
    toast("原始影片超過 60MB，請先剪短再選");
    input.value = "";
    return;
  }
  setVidProgress(25, "載入影片中...");
  const rawUrl = URL.createObjectURL(f);
  rawPickedVideoBlob = f;
  rawPickedVideoName = f.name || "video.mp4";
  localVideoBlob = f;
  trimStartSec = 0;
  state.videoUrl = rawUrl;
  if (String(state.photoUrl || "").includes("refin-moon-poster")) state.photoUrl = "";
  const inp = document.getElementById("inVideoUrl"); if (inp) inp.value = rawPickedVideoName;
  const del = document.getElementById("btnDelVideo"); if (del) del.style.display = "inline-flex";
  if (!VIDEO_STYLES.includes(state.style)) {
    state.style = "video";
    syncCssVars();
  }
  renderPreview();
  idbPut("video", { blob: f, name: rawPickedVideoName });

  // 等畫面上真正的 <video> 載入或播放後立刻擷取新封面並開啟位置拉選條
  const cardVid = document.querySelector("#cardMount video");
  const probe = cardVid || document.createElement("video");
  let handled = false;
  const grabPosterSafe = async () => {
    if (probe.videoWidth > 0) {
      const poster = await captureVideoPoster(probe);
      if (poster) { state.photoUrl = poster; persistLocal(); }
    }
  };
  const onReady = async () => {
    if (handled) return;
    handled = true;
    rawVideoDuration = isFinite(probe.duration) ? probe.duration : 0;
    await grabPosterSafe();
    setVidProgress(100, "影片已更新", 900);
    openVidTrimBar();
    toast(rawVideoDuration > 10.5 ? "影片已載入，可拉選要切的 10 秒與畫面位置" : "影片已更新，可拉選上下位置");
    setTimeout(() => { input.value = ""; }, 300);
  };
  probe.addEventListener("playing", grabPosterSafe, { once: true });
  if (probe.readyState >= 2) {
    onReady();
  } else {
    probe.addEventListener("loadeddata", onReady, { once: true });
    probe.addEventListener("loadedmetadata", () => {
      rawVideoDuration = isFinite(probe.duration) ? probe.duration : 0;
    }, { once: true });
    setTimeout(onReady, 1800);
  }
}

function blobToDataUrl(blob) {
  return new Promise((res, rej) => { const fr = new FileReader(); fr.onload = () => res(fr.result); fr.onerror = rej; fr.readAsDataURL(blob); });
}
let lastUploadError = "";
async function uploadLocalAsset(kind, dataUrl) {

  try {
    const r = await fetch(CFG.GAS_API, {
      method: "POST", headers: { "Content-Type": "text/plain;charset=utf-8" },
      body: JSON.stringify({ action: "ecardUploadAsset", publicUpload: true, cardId: currentCardId || "card", kind, dataUrl })
    }).then(x => x.json());

/* 送出前確保影片 ≤10MB / ≤10 秒：太大就自動壓縮裁切，不需要使用者手動按「套用」 */
async function ensureVideoUploadable() {
  if (!VIDEO_STYLES.includes(state.style)) return true;
  if (!localVideoBlob || !String(state.videoUrl || "").startsWith("blob:")) return true;
  const tooBig = localVideoBlob.size > 9.5 * 1024 * 1024;
  const tooLong = rawVideoDuration > 10.5;
  if (!tooBig && !tooLong) return true;
  showBusy("影片過大，自動壓縮至 10 秒內...", 25, "約需 10～15 秒，請勿離開畫面");
  rawPickedVideoBlob = rawPickedVideoBlob || localVideoBlob;
  await applyVideoTrim();
  return !!(localVideoBlob && localVideoBlob.size <= 10 * 1024 * 1024);
}

/* 儲存 + Telegram 通知 */
async function saveCard(silent, withModal) {
  if (!silent && !isAdminMode && localEditUsed >= 3 && !(profile && profile.donated)) { openDonateModal(); return false; }
  persistLocal();
  const btn = document.getElementById("btnSave");
  btn.disabled = true; btn.textContent = "儲存中";
  if (withModal) showBusy("同步最新名片中...", 18, "正在準備 Logo 與素材");
  try {
    const okSize = await ensureVideoUploadable();
    if (!okSize) {
      showBusyError("影片太大，無法上傳", "請改選 10 秒內的影片，或按「調整位置 → 套用目前位置」先壓縮後再發送。");
      return false;
    }
    const publishCfg = Object.assign({}, state);
    if (VIDEO_STYLES.includes(publishCfg.style) && publishCfg.videoUrl && !String(publishCfg.videoUrl).includes("refin-moon")) {
      const liveVid = document.querySelector("#cardMount video");
      if (liveVid && liveVid.videoWidth > 0 && (!publishCfg.photoUrl || String(publishCfg.photoUrl).includes("refin-moon-poster"))) {
        const freshPoster = await captureVideoPoster(liveVid);
        if (freshPoster) { publishCfg.photoUrl = freshPoster; state.photoUrl = freshPoster; }
      }
    }

    let videoFailMsg = "";
    const tasks = [];
    if (publishCfg.logoUrl && publishCfg.logoUrl.startsWith("data:image/")) {
      tasks.push(uploadLocalAsset("logo", publishCfg.logoUrl).then(u => {
        if (u) { publishCfg.logoUrl = u; state.logoUrl = u; }
      }));
    }
    if (publishCfg.photoUrl && (publishCfg.photoUrl.startsWith("data:image/") || publishCfg.photoUrl.startsWith("blob:"))) {
      tasks.push((async () => {
        const photoData = publishCfg.photoUrl.startsWith("blob:") ? await fetch(publishCfg.photoUrl).then(x => x.blob()).then(blobToDataUrl) : publishCfg.photoUrl;
        const u = await uploadLocalAsset("photo", photoData);
        if (u) { publishCfg.photoUrl = u; state.photoUrl = u; }
      })());
    }
    if (publishCfg.videoUrl && publishCfg.videoUrl.startsWith("blob:") && localVideoBlob) {
      tasks.push((async () => {
        if (withModal) showBusy("上傳影片至雲端...", 55, "檔案較大時需幾秒鐘");
        setVidProgress(40, "上傳影片至雲端...");
        const dataUrl = await blobToDataUrl(localVideoBlob);
        if (withModal) showBusy("同步影片連結...", 80, "即將完成");
        setVidProgress(75, "同步影片連結...");
        const u = await uploadLocalAsset("video", dataUrl);
        if (u) { publishCfg.videoUrl = u; state.videoUrl = u; }
        else videoFailMsg = lastUploadError || "未知原因";
        setVidProgress(100, "雲端同步完成", 900);
      })());
    }
    if (tasks.length) {
      if (withModal) showBusy("上傳素材中...", 45, "Logo、圖片與影片同步上傳");
      await Promise.all(tasks);
    }

    // 影片版上傳失敗：明確擋下，不可以偷偷送出沒有影片的名片
    if (VIDEO_STYLES.includes(publishCfg.style) && videoFailMsg) {
      showBusyError("影片上傳失敗，名片未送出", videoFailMsg);
      return false;
    }

    // 防止未上傳成功的 data:/blob: 撐爆 Google Sheets 50,000 字元上限
    if (publishCfg.logoUrl && !/^https?:\/\//i.test(publishCfg.logoUrl)) publishCfg.logoUrl = "";
    if (publishCfg.photoUrl && !/^https?:\/\//i.test(publishCfg.photoUrl)) publishCfg.photoUrl = "";
    if (publishCfg.videoUrl && !/^https?:\/\//i.test(publishCfg.videoUrl)) publishCfg.videoUrl = "";
    if (VIDEO_STYLES.includes(publishCfg.style) && !publishCfg.videoUrl) {
      showBusyError("沒有可用的影片", "影片版需要先選一支影片（或貼 YouTube 連結），或改用圖片版。");
      return false;
    }

    if (!silent) {
      localEditUsed++;
      localStorage.setItem("ck_local_edit_used", String(localEditUsed));
    }
    if (withModal) showBusy("建立名片連結...", 92, "即將開啟 LINE 分享名單");
    const r = await fetch(CFG.GAS_API, {
      method: "POST", headers: { "Content-Type": "text/plain;charset=utf-8" },
      body: JSON.stringify({ action: "ecardNotifyCreate", cardId: (profile && profile.slug) || currentCardId || "", userEmail: (session && session.user && session.user.email) || "", config: publishCfg })
    }).then(x => x.json());
    if (r && r.success && r.cardId) {
      currentCardId = r.cardId;
      localStorage.setItem("ck_my_card_id", currentCardId);
      rememberAdminCard(currentCardId, publishCfg);
      dirtySinceSave = false;
      persistLocal();
      dirtySinceSave = false;
      if (isAdminMode) loadAdminCardList();
      if (!silent) toast("已儲存");
      return true;
    }
    showBusyError("雲端儲存失敗", (r && r.error) ? String(r.error) : "請檢查網路後重試");
    return false;
  } catch (e) {
    showBusyError("雲端同步失敗", String(e && e.message || e));
    return false;
  } finally {
    btn.disabled = false; btn.textContent = "儲存";
  }
}

async function shareToLine() {
  const isMobile = /iPhone|iPad|Android|Line|Mobile/i.test(navigator.userAgent);
  const needSync = dirtySinceSave || !currentCardId || (state.videoUrl && state.videoUrl.startsWith("blob:")) || (state.logoUrl && state.logoUrl.startsWith("data:")) || (state.photoUrl && (state.photoUrl.startsWith("data:") || state.photoUrl.startsWith("blob:")));
  let popup = null;
  if (!isMobile) {
    try { popup = window.open("about:blank", "_blank"); } catch (e) {}
  }
  showBusy("發送名片中...", 15, needSync ? "同步最新文字與素材" : "正在開啟 LINE 分享名單");
  if (needSync) {
    let ok = false;
    try {
      ok = await Promise.race([saveCard(true, true), new Promise(res => setTimeout(() => res(false), 90000))]);
    } catch (e) { ok = false; }
    if (!ok) {
      // 同步失敗：絕不開啟 LINE，避免把舊版/不完整名片傳出去（錯誤視窗已由 saveCard 顯示）
      if (popup && !popup.closed) popup.close();
      const m = document.getElementById("busyModal");
      if (!m || m.style.display === "none" || document.getElementById("busyOkBtn").style.display === "none") {
        showBusyError("同步逾時，名片未送出", "網路較慢或影片太大，請稍後再按一次「發送名片」。");
      }
      return;
    }
  }
  const slug = (profile && profile.slug) || currentCardId;
  if (!slug) {
    if (popup && !popup.closed) popup.close();
    showBusyError("尚未建立名片", "請先按右上角「儲存」，再發送名片。");
    return;
  }
  const url = `https://liff.line.me/${CFG.LIFF_ID}?mode=card&id=${encodeURIComponent(slug)}`;
  hideBusy();
  if (popup && !popup.closed) {
    popup.location.href = url;
  } else {
    location.href = url;
  }
}

const ADMIN_DEFAULT_CATS = ["自己", "客戶", "夥伴", "測試"];
let adminCatFilter = "all";
let adminCardsCache = [];

function getLocalAdminCards() {
  try {
    const arr = JSON.parse(localStorage.getItem("ck_admin_cards") || "[]");
    return Array.isArray(arr) ? arr : [];
  } catch (e) { return []; }
}
function saveLocalAdminCards(list) {
  try { localStorage.setItem("ck_admin_cards", JSON.stringify(list.slice(0, 80))); } catch (e) {}
}
function rememberAdminCard(cardId, cfg) {
  if (!cardId) return;
  const old = getLocalAdminCards().find(x => x && x.cardId === cardId) || {};
  const list = getLocalAdminCards().filter(x => x && x.cardId !== cardId);
  list.unshift({
    cardId,
    alias: old.alias || "",
    category: old.category || (cardId === "bigt" ? "自己" : "客戶"),
    cardName: (cfg && cfg.name) || old.cardName || "",
    enName: (cfg && cfg.enName) || old.enName || "",
    company: (cfg && cfg.company) || old.company || "",
    style: (cfg && cfg.style) || old.style || ""
  });
  saveLocalAdminCards(list);
}

function renderAdminSelect() {

async function loadAdminCardList() {
  if (!isAdminMode) return;
  if (currentCardId) rememberAdminCard(currentCardId, state);
  const map = new Map();
  getLocalAdminCards().forEach(it => { if (it && it.cardId) map.set(it.cardId, Object.assign({ category: "客戶", alias: "" }, it)); });
  if (!map.has("bigt")) map.set("bigt", { cardId: "bigt", alias: "", category: "自己", cardName: "高弘治", enName: "Big-T", company: "高雅瓷", style: "video" });

  const adminKey = localStorage.getItem("ck_admin_key") || "";
  if (adminKey) {
    try {
      const r = await fetch(CFG.GAS_API + "?ac=ecardAdminList&key=" + encodeURIComponent(adminKey)).then(x => x.json());
      if (r && r.success && Array.isArray(r.items)) {
        r.items.forEach(it => {
          if (!it || !it.cardId) return;
          const prev = map.get(it.cardId) || {};
          map.set(it.cardId, Object.assign({ category: it.cardId === "bigt" ? "自己" : "客戶", alias: "" }, it, { alias: prev.alias || "", category: prev.category || (it.cardId === "bigt" ? "自己" : "客戶") }));

  }
  adminCardsCache = Array.from(map.values());

        </div>
      </div>
    `;
  }).join("");
}

function updateAdminCardMeta(cardId, field, val) {
  const item = adminCardsCache.find(x => x.cardId === cardId);
  if (!item) return;
  item[field] = String(val || "").trim();
  saveLocalAdminCards(adminCardsCache);
  renderAdminSelect();
  toast("已更新清單設定");
}

function deleteAdminCardItem(cardId) {
  adminCardsCache = adminCardsCache.filter(x => x.cardId !== cardId);
  saveLocalAdminCards(adminCardsCache);
  if (currentCardId === cardId) {
    currentCardId = "";
    localStorage.removeItem("ck_my_card_id");
  }
  renderAdminSelect();
  renderAdminMgrList();
  toast("已從清單移除");
}

async function saveAdminKeyAndSync() {
  const k = (document.getElementById("inAdminKey").value || "").trim();
  if (k) localStorage.setItem("ck_admin_key", k);
  else localStorage.removeItem("ck_admin_key");
  await loadAdminCardList();
  toast("已同步雲端名片清單");
}

async function onAdminPickCard(cardId) {
  if (!cardId) { adminNewCard(); return; }
  showBusy("載入名片中...", 45, cardId);
  try {
    const r = await fetch(CFG.GAS_API + "?ac=ecardGet&id=" + encodeURIComponent(cardId)).then(x => x.json());
    if (r && r.success && r.config) {
      localVideoBlob = null; rawPickedVideoBlob = null; rawLogoSource = null;
      await Promise.all([idbDel("video"), idbDel("photo"), idbDel("rawLogo")]);
      state = Object.assign(defaultState(), r.config);
      currentCardId = cardId;
      localStorage.setItem("ck_my_card_id", currentCardId);
      syncCssVars(); renderSocialControls(); renderPreview();
      dirtySinceSave = false;
      toast("已切換：" + (state.name || cardId));
    } else {
      toast("載入失敗");
    }
  } catch (e) { toast("載入失敗"); }
  finally { hideBusy(); }
}

async function adminNewCard() {
  localVideoBlob = null; rawPickedVideoBlob = null; rawLogoSource = null;
  await Promise.all([idbDel("video"), idbDel("photo"), idbDel("rawLogo")]);
  currentCardId = "";
  localStorage.removeItem("ck_my_card_id");
  state = defaultState();
  const sel = document.getElementById("adminCardSelect");
  if (sel) sel.value = "";
  syncCssVars(); renderSocialControls(); renderPreview();
  toast("已開新名片（不覆蓋舊卡片）");
}

function initAdminBar() {
  if (!isAdminMode) return;
  const bar = document.getElementById("adminBar");
  if (bar) bar.style.display = "flex";
  loadAdminCardList();
}

let tTimer;
function toast(msg) {
  const el = document.getElementById("toast"); el.textContent = msg; el.classList.add("show");
  clearTimeout(tTimer); tTimer = setTimeout(() => el.classList.remove("show"), 2000);
}

syncCssVars();
renderSocialControls();
renderPreview();
restoreLocalMedia();
loadPreviewParamIfAny();
initAdminBar();
</script>
</body>
</html>
