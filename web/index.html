<style>
  :root {
    --bg: #f6f4ef;
    --surface: #fffdf9;
    --raised: #eeeae2;
    --border: rgba(31, 27, 22, 0.11);
    --t1: #1f1b16;
    --t2: #5e554a;
    --t3: #7b7266;
    --accent: #c5ae6e;
    --accent-text: #1f1b16;
    --head-bg: #23201b;
    --body-bg: #23201b;
    --foot-bg: #23201b;
    --btn2-bg: #332e27;
    --card-fg: #f1ece2;
    --card-font: "Microsoft JhengHei", "微軟正黑體", sans-serif;
    --line-green: #06c755;
    --chat-bg-light: #8cabd9;
    --chat-bg-dark: #111315;
    --err: #b4412f;
  }

  * { box-sizing: border-box; margin: 0; padding: 0; }
  html, body { overflow-x: hidden; width: 100%; max-width: 100vw; }
  body {
    font-family: "Microsoft JhengHei", "微軟正黑體", sans-serif;
    background: var(--bg);
    color: var(--t1);
    min-height: 100vh;
  }

  /* 頂部列 */
  .topbar {
    position: sticky; top: 0; z-index: 30;
    background: rgba(255, 253, 249, 0.96);
    border-bottom: 1px solid var(--border);
    padding: 9px 14px;
    display: flex; align-items: center; justify-content: space-between; gap: 8px;
  }
  .topbar-title { display: flex; align-items: center; gap: 8px; min-width: 0; }
  .topbar h1 { font-size: 15px; font-weight: 700; white-space: nowrap; }
  .toolbar { display: flex; align-items: center; gap: 6px; flex-shrink: 0; }

  .btn {
    appearance: none; border: 1px solid var(--border); background: var(--surface);
    color: var(--t1); font-size: 13px; font-weight: 600; padding: 7px 13px;
    border-radius: 8px; cursor: pointer; display: inline-flex; align-items: center;
    justify-content: center; gap: 6px; text-decoration: none; font-family: inherit;
  }
  .btn:hover { background: var(--raised); }
  .btn:disabled { opacity: 0.45; cursor: not-allowed; }
  .btn-pri { background: #23201b; border-color: #23201b; color: #fff; }
  .btn-danger { color: var(--err); border-color: rgba(180,65,47,0.3); }
  .btn-sm { padding: 5px 10px; font-size: 12px; border-radius: 7px; }

  .icon-btn {
    appearance: none; width: 34px; height: 34px; border-radius: 9px;
    border: 1px solid var(--border); background: var(--surface); color: var(--t1);
    display: inline-flex; align-items: center; justify-content: center; cursor: pointer;
  }
  .icon-btn:hover { background: var(--raised); }
  .icon-btn.line-ico { background: var(--line-green); border-color: var(--line-green); color: #fff; }
  .icon-btn.acct-ico { border-radius: 999px; background: #23201b; border-color: #23201b; color: var(--accent); font-size: 13px; font-weight: 700; }

  /* 單欄精簡置中工作台（手機與電腦皆零來回捲動） */
  .studio {
    max-width: 480px;
    width: 100%;
    margin: 0 auto;
    padding: 12px 12px 48px;
    display: flex;
    flex-direction: column;
    gap: 10px;
  }

  /* 頂部快選條：拍名片 + 8 款橫滑版型 */
  .top-strip {
    display: flex; align-items: center; gap: 8px; width: 100%;
  }
  .style-bar {
    display: flex; overflow-x: auto; flex-wrap: nowrap; gap: 6px; width: 100%;
    padding: 2px 0; -webkit-overflow-scrolling: touch;
  }
  .style-bar::-webkit-scrollbar { display: none; }
  .style-opt {
    flex: 0 0 auto; border: 1.5px solid var(--border); border-radius: 999px;
    padding: 6px 13px; background: var(--surface); cursor: pointer;
    font-family: inherit; font-size: 12.5px; font-weight: 700; color: var(--t1); white-space: nowrap;
  }
  .style-opt.active { border-color: #23201b; background: #23201b; color: var(--accent); }

  /* 預覽舞台 */
  .canvas-stage {
    border-radius: 18px;
    background: var(--chat-bg-light);
    padding: 14px 12px 16px;
    display: flex; flex-direction: column; align-items: center; gap: 10px;
    transition: background 0.2s;
  }
  .canvas-stage.dark-chat { background: var(--chat-bg-dark); }

  /* 所見即所得單張名片 */
  .mega-card {
    width: 100%; max-width: 344px; border-radius: 18px; overflow: hidden;
    box-shadow: 0 12px 32px rgba(0,0,0,0.22);
    font-family: var(--card-font);
    background: var(--body-bg);
    color: var(--card-fg);
  }
  .mega-card.style-frame { border: 3px solid var(--card-fg); border-radius: 12px; }
  .mc-top-bar { height: 5px; background: var(--accent); }
  .mc-head-area { background: var(--head-bg); }
  .mc-body { padding: 12px 18px; display: flex; flex-direction: column; gap: 7px; background: var(--body-bg); }
  .mc-foot { padding: 6px 18px 14px; display: flex; flex-direction: column; gap: 8px; background: var(--foot-bg); }

  /* 行內直接點字編輯樣式 */
  .ed-wrap { display: inline-flex; align-items: center; gap: 4px; max-width: 100%; }
  [contenteditable="true"] {
    outline: none; border-radius: 4px; padding: 1px 3px; min-width: 18px;
    transition: background 0.12s, box-shadow 0.12s; cursor: text;
  }
  [contenteditable="true"]:hover { background: rgba(197, 174, 110, 0.14); }
  [contenteditable="true"]:focus { background: rgba(197, 174, 110, 0.22); box-shadow: 0 0 0 1.5px var(--accent); }

  .del-x {
    appearance: none; border: none; background: rgba(128,128,128,0.28); color: inherit;
    width: 16px; height: 16px; border-radius: 999px; font-size: 10px; line-height: 1;
    display: inline-flex; align-items: center; justify-content: center; cursor: pointer;
    flex-shrink: 0; opacity: 0.65;
  }
  .del-x:hover { opacity: 1; background: var(--err); color: #fff; }
  .clean-view .del-x, .clean-view .add-row-inline { display: none !important; }

  .add-row-inline {
    appearance: none; border: 1px dashed rgba(197,174,110,0.45); background: transparent;
    color: var(--accent); font-size: 11.5px; font-weight: 700; padding: 4px 10px;
    border-radius: 6px; cursor: pointer; align-self: flex-start; margin-top: 2px; font-family: inherit;
  }

  .color-pick-mode [data-cslot] { cursor: crosshair !important; }
  .color-pick-mode [data-cslot]:hover { outline: 2px dashed var(--accent); outline-offset: -2px; }

  .mc-brand-row { display: flex; align-items: center; justify-content: space-between; gap: 8px; margin-bottom: 8px; }
  .mc-logo { height: 22px; color: var(--accent); flex-shrink: 0; }
  .mc-logo img { height: 22px; width: auto; max-width: 120px; object-fit: contain; display: block; }
  .mc-co-name { font-size: 11.5px; font-weight: 600; opacity: 0.8; }
  .mc-name-line { display: flex; align-items: baseline; flex-wrap: wrap; gap: 6px; }
  .mc-name { font-size: 21px; font-weight: 700; line-height: 1.25; }
  .mc-en-name { font-size: 15px; font-weight: 700; color: var(--accent); }
  .mc-slogan { font-size: 12px; opacity: 0.82; margin-top: 5px; line-height: 1.4; }
  .mc-sep { height: 1px; background: currentColor; opacity: 0.14; margin: 0 18px; }

  .mc-row { display: flex; align-items: center; gap: 8px; font-size: 12.5px; line-height: 1.4; }
  .mc-lbl { min-width: 34px; flex-shrink: 0; color: var(--accent); font-size: 11.5px; font-weight: 700; }
  .mc-val { flex: 1; min-width: 0; word-break: break-word; }

  .mc-btn-row { display: grid; grid-template-columns: 1fr 1fr; gap: 8px; }
  .mc-btn-pri {
    height: 38px; border-radius: 8px; background: var(--accent); color: var(--accent-text);
    display: flex; align-items: center; justify-content: center; gap: 6px;
    font-size: 13px; font-weight: 700; border: none; cursor: pointer; font-family: inherit;
  }
  .mc-btn-sec {
    height: 38px; border-radius: 8px; background: var(--btn2-bg); color: var(--card-fg);
    display: flex; align-items: center; justify-content: center; gap: 6px;
    font-size: 13px; font-weight: 600; border: none; cursor: pointer; font-family: inherit;
  }
  .mc-btn-link {
    height: 26px; background: transparent; border: none; color: var(--accent);
    font-size: 12.5px; font-weight: 600; cursor: pointer; font-family: inherit;
  }

  /* 全 SVG 圖示社群列 */
  .mc-icon-row { display: flex; justify-content: center; flex-wrap: wrap; gap: 8px; padding: 2px 0; }
  .mc-icon-chip {
    width: 36px; height: 36px; border-radius: 10px;
    background: rgba(128,128,128,0.16); border: 1px solid rgba(197,174,110,0.36);
    color: var(--accent); display: inline-flex; align-items: center; justify-content: center;
    text-decoration: none; cursor: pointer;
  }

  .mc-video-box { position: relative; width: 100%; aspect-ratio: 16/9; background: #14120f; overflow: hidden; }
  .mc-video-box video, .mc-video-box img { width: 100%; height: 100%; object-fit: cover; display: block; }
  .mc-yt-play { position: absolute; inset: 0; background: rgba(0,0,0,0.24); display: flex; align-items: center; justify-content: center; }
  .mc-yt-play span { width: 48px; height: 34px; border-radius: 9px; background: rgba(0,0,0,0.72); color: #fff; display: inline-flex; align-items: center; justify-content: center; }
  .mc-photo { width: 60px; height: 74px; border-radius: 10px; overflow: hidden; flex-shrink: 0; border: 1.5px solid var(--accent); }
  .mc-photo img { width: 100%; height: 100%; object-fit: cover; display: block; }
  .mc-hero-box { position: relative; height: 176px; background: #2c2822; overflow: hidden; }
  .mc-hero-img { width: 100%; height: 100%; object-fit: cover; display: block; }
  .mc-hero-grad { position: absolute; inset: 0; background: linear-gradient(180deg, rgba(20,18,15,0.12) 0%, rgba(20,18,15,0.2) 40%, rgba(20,18,15,0.88) 100%); display: flex; flex-direction: column; justify-content: space-between; padding: 12px 16px; }
  .mc-logo-pill { background: rgba(255,253,249,0.92); padding: 4px 8px; border-radius: 6px; display: inline-flex; }
  .mc-logo-pill img { height: 16px; width: auto; max-width: 100px; display: block; }
  .mc-side-grid { display: grid; grid-template-columns: 112px 1fr; min-height: 196px; }
  .mc-side-media { position: relative; background: #181613; overflow: hidden; }
  .mc-side-media img, .mc-side-media video { width: 100%; height: 100%; object-fit: cover; display: block; }
  .mc-side-info { padding: 14px 12px; display: flex; flex-direction: column; justify-content: center; gap: 6px; }
  .mc-block-top { padding: 16px 18px 14px; }

  /* 點擊按鈕時浮出的極簡單行編輯條 */
  .inline-bar {
    display: none; width: 100%; max-width: 344px;
    background: var(--surface); border: 1px solid var(--border); border-radius: 12px;
    padding: 8px; gap: 6px; align-items: center; box-shadow: 0 6px 20px rgba(0,0,0,0.12);
  }
  .inline-bar input {
    flex: 1; height: 34px; padding: 0 9px; border: 1px solid var(--border);
    border-radius: 7px; font-size: 13px; font-family: inherit; min-width: 0;
  }

  /* 進階設定收合區 */
  .adv-card {
    background: var(--surface); border: 1px solid var(--border);
    border-radius: 14px; padding: 12px; display: flex; flex-direction: column; gap: 12px;
  }
  .dock-tabs {
    display: grid; grid-template-columns: repeat(3, 1fr); gap: 4px;
    background: var(--raised); padding: 4px; border-radius: 9px;
  }
  .dock-tab {
    border: none; background: transparent; padding: 7px 4px; border-radius: 6px;
    font-size: 12.5px; font-weight: 700; color: var(--t2); cursor: pointer; font-family: inherit;
  }
  .dock-tab.active { background: var(--surface); color: var(--t1); }
  .dock-pane { display: none; flex-direction: column; gap: 12px; }
  .dock-pane.active { display: flex; }

  .slot-tabs { display: flex; flex-wrap: wrap; gap: 4px; background: var(--raised); padding: 3px; border-radius: 8px; }
  .slot-tab { border: none; background: transparent; padding: 4px 9px; border-radius: 6px; font-size: 12px; font-weight: 700; color: var(--t2); cursor: pointer; font-family: inherit; }
  .slot-tab.active { background: var(--surface); color: var(--t1); }

  .color-row { display: flex; align-items: center; gap: 8px; }
  .color-picker-wrap { position: relative; width: 38px; height: 34px; border-radius: 8px; overflow: hidden; border: 1px solid var(--border); flex-shrink: 0; }
  .color-picker-wrap input[type="color"] { position: absolute; inset: -6px; width: 52px; height: 48px; border: none; cursor: pointer; }
  .swatches { display: flex; flex-wrap: wrap; gap: 8px; }
  .swatch { width: 26px; height: 26px; border-radius: 999px; border: 2px solid transparent; cursor: pointer; box-shadow: inset 0 0 0 1px rgba(0,0,0,0.12); }
  .swatch.active { border-color: #1f1b16; }

  .ext-stack { display: flex; flex-direction: column; gap: 7px; }
  .ext-row {
    display: grid; grid-template-columns: 96px 1fr; align-items: center; gap: 8px;
    padding: 6px 9px; background: var(--bg); border: 1px solid var(--border); border-radius: 9px;
  }
  .ext-chk { display: inline-flex; align-items: center; gap: 6px; font-size: 12.5px; font-weight: 700; cursor: pointer; }
  .ext-chk input { width: 15px; height: 15px; accent-color: #23201b; }
  .ext-row input[type="text"], .ext-row input[type="email"] {
    height: 32px; padding: 0 9px; border: 1px solid var(--border); border-radius: 7px;
    font-size: 12.5px; background: #fff; font-family: inherit; width: 100%;
  }

  .modal-bg { display: none; position: fixed; inset: 0; z-index: 200; background: rgba(31,27,22,0.58); align-items: center; justify-content: center; padding: 20px; }
  .modal-card { background: #fffdf9; border-radius: 18px; padding: 24px; max-width: 360px; width: 100%; text-align: center; display: flex; flex-direction: column; gap: 12px; }
  .toast { position: fixed; bottom: 20px; left: 50%; transform: translateX(-50%) translateY(20px); background: #1f1b16; color: #fff; padding: 9px 16px; border-radius: 10px; font-size: 12.5px; opacity: 0; pointer-events: none; transition: 0.2s; z-index: 250; }
  .toast.show { opacity: 1; transform: translateX(-50%) translateY(0); }
</style>
</head>
<body>

<header class="topbar">
  <div class="topbar-title">
    <svg width="28" height="28" viewBox="0 0 64 64">
      <rect width="64" height="64" rx="14" fill="#23201B"/>
      <rect x="12" y="18" width="40" height="28" rx="5" fill="none" stroke="#C5AE6E" stroke-width="4"/>
      <line x1="18" y1="27" x2="36" y2="27" stroke="#C5AE6E" stroke-width="3.5" stroke-linecap="round"/>
      <line x1="18" y1="35" x2="30" y2="35" stroke="#E8D9AD" stroke-width="3" stroke-linecap="round"/>
      <circle cx="43" cy="31" r="4" fill="#C5AE6E"/>
    </svg>
    <h1>LINE 名片王</h1>
  </div>
  <div class="toolbar">

    <button type="button" class="icon-btn" id="btnTheme" title="深淺背景" onclick="toggleChatTheme()">

      <svg width="18" height="18" viewBox="0 0 24 24" fill="currentColor"><path d="M19.365 9.863c.349 0 .63.285.63.631 0 .345-.281.63-.63.63H17.61v1.125h1.755c.349 0 .63.283.63.63 0 .344-.281.629-.63.629h-2.386c-.345 0-.627-.285-.627-.629V8.108c0-.345.282-.63.63-.63h2.386c.346 0 .627.285.627.63 0 .349-.281.63-.63.63H17.61v1.125h1.755zm-3.855 3.016c0 .27-.174.51-.432.596-.064.021-.133.031-.199.031-.211 0-.391-.09-.51-.25l-2.443-3.317v2.94c0 .344-.279.629-.631.629-.346 0-.626-.285-.626-.629V8.108c0-.27.173-.51.43-.595.06-.023.136-.033.194-.033.195 0 .375.104.495.254l2.462 3.33V8.108c0-.345.282-.63.63-.63.345 0 .63.285.63.63v4.771zm-5.741 0c0 .344-.282.629-.631.629-.345 0-.627-.285-.627-.629V8.108c0-.345.282-.63.63-.63.346 0 .628.285.628.63v4.771zm-2.466.629H4.917c-.345 0-.63-.285-.63-.629V8.108c0-.345.285-.63.63-.63.348 0 .63.285.63.63v4.141h1.756c.348 0 .629.283.629.63 0 .344-.282.629-.629.629M24 10.314C24 4.943 18.615.572 12 .572S0 4.943 0 10.314c0 4.811 4.27 8.842 10.035 9.608.391.082.923.258 1.058.59.12.301.079.766.038 1.08l-.164 1.02c-.045.301-.24 1.186 1.049.645 1.291-.539 6.916-4.078 9.436-6.975C23.176 14.393 24 12.458 24 10.314"/></svg>
    </button>
    <button type="button" class="icon-btn acct-ico" id="btnAuthOpen" title="登入 / 註冊" onclick="openAuthModal()">
      <svg width="16" height="16" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2" stroke-linecap="round"><path d="M20 21v-2a4 4 0 0 0-4-4H8a4 4 0 0 0-4 4v2"/><circle cx="12" cy="7" r="4"/></svg>
    </button>
  </div>
</header>

<main class="studio">
  <!-- 拍名片 + 預覽開關 -->
  <div class="top-strip">
    <input type="file" id="ocrFile" accept="image/*" capture="environment" hidden onchange="onOcrPick(event)">
    <button type="button" class="btn btn-pri" id="btnOcr" style="flex:1;height:38px;" onclick="document.getElementById('ocrFile').click()">
      <svg width="16" height="16" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2" stroke-linecap="round"><path d="M23 19a2 2 0 0 1-2 2H3a2 2 0 0 1-2-2V8a2 2 0 0 1 2-2h4l2-3h6l2 3h4a2 2 0 0 1 2 2z"/><circle cx="12" cy="13" r="4"/></svg>
      拍名片自動填入
    </button>
    <button type="button" class="btn" id="btnCleanToggle" style="height:38px;" onclick="toggleCleanView()">預覽</button>
  </div>

  <!-- 8 款版型橫滑一條 -->
  <div class="style-bar" id="styleGrid">
    <button type="button" class="style-opt" data-style="video" onclick="setStyle('video')">動態影片</button>
    <button type="button" class="style-opt active" data-style="dark" onclick="setStyle('dark')">深岩燙金</button>
    <button type="button" class="style-opt" data-style="hero" onclick="setStyle('hero')">雜誌封面</button>
    <button type="button" class="style-opt" data-style="ivory" onclick="setStyle('ivory')">極簡象牙</button>
    <button type="button" class="style-opt" data-style="full" onclick="setStyle('full')">全資訊旗艦</button>
    <button type="button" class="style-opt" data-style="side" onclick="setStyle('side')">側邊影像</button>
    <button type="button" class="style-opt" data-style="block" onclick="setStyle('block')">莫蘭迪撞色</button>
    <button type="button" class="style-opt" data-style="frame" onclick="setStyle('frame')">建築黑框</button>
  </div>

  <!-- 直接點字修改的名片本體 -->
  <section class="canvas-stage" id="phoneScreen">
    <div id="cardMount" style="width:100%;display:flex;justify-content:center;"></div>
    <!-- 點擊按鈕浮出的單行編輯條 -->
    <div class="inline-bar" id="btnEditBar">
      <input type="text" id="inlineBtnVal" placeholder="">
      <button type="button" class="btn btn-sm btn-pri" onclick="closeInlineBar()">完成</button>
    </div>

function esc(s) { return String(s || "").replace(/&/g,"&amp;").replace(/</g,"&lt;").replace(/>/g,"&gt;").replace(/"/g,"&quot;"); }

function getContrast(hex) { const h = hex.replace("#",""); return (parseInt(h.slice(0,2),16)*299 + parseInt(h.slice(2,4),16)*587 + parseInt(h.slice(4,6),16)*114)/1000 >= 165 ? "#1F1B16" : "#FFFFFF"; }

  state.footBg = def.footBg; state.btn2Bg = def.btn2Bg; state.cardFg = def.fg;

  syncCssVars(); renderPreview();
}

const SLOT_NAMES = { accent: "主色", headBg: "上框", bodyBg: "中框", footBg: "下框", btn2Bg: "次鈕", fg: "文字" };
function getSlotValue(slot) {
  return slot === "headBg" ? state.headBg : (slot === "bodyBg" ? state.bodyBg : (slot === "footBg" ? state.footBg : (slot === "btn2Bg" ? state.btn2Bg : (slot === "fg" ? state.cardFg : state.color))));
}
function selectColorSlot(slot) {
  colorSlot = slot;
  document.querySelectorAll(".slot-tab[data-slot]").forEach(b => b.classList.toggle("active", b.dataset.slot === slot));
  const cur = (getSlotValue(slot) || "#C5AE6E").toUpperCase();
  document.getElementById("inColor").value = cur.toLowerCase();
  document.getElementById("inColorHex").value = cur;
  document.querySelectorAll("#swatches .swatch").forEach(b => b.classList.toggle("active", b.dataset.hex.toUpperCase() === cur));
}
function syncCssVars() {
  document.documentElement.style.setProperty("--accent", state.color);
  document.documentElement.style.setProperty("--accent-text", getContrast(state.color));
  document.documentElement.style.setProperty("--head-bg", state.headBg);
  document.documentElement.style.setProperty("--body-bg", state.bodyBg);
  document.documentElement.style.setProperty("--foot-bg", state.footBg);
  document.documentElement.style.setProperty("--btn2-bg", state.btn2Bg);
  document.documentElement.style.setProperty("--card-fg", state.cardFg);
  document.documentElement.style.setProperty("--card-font", FONTS[state.font] || FONTS.jhenghei);
  selectColorSlot(colorSlot);
}
function applySlotColor(hex) {
  if (!/^#[0-9a-fA-F]{6}$/.test(hex)) return;
  const u = hex.toUpperCase();
  if (colorSlot === "headBg") state.headBg = u;
  else if (colorSlot === "bodyBg") state.bodyBg = u;
  else if (colorSlot === "footBg") state.footBg = u;
  else if (colorSlot === "btn2Bg") state.btn2Bg = u;
  else if (colorSlot === "fg") state.cardFg = u;
  else state.color = u;
  syncCssVars(); renderPreview();
}
function onHexInput(v) { const c = v.trim().startsWith("#") ? v.trim() : "#" + v.trim(); if (/^#[0-9a-fA-F]{6}$/.test(c)) applySlotColor(c); }

  const nameLine = (nameHtml || enHtml) ? `<div class="mc-name-line">${nameHtml}${enHtml}</div>` : "";
  const sloganHtml = state.slogan

  const rowsHtml = state.infoRows.map((r, i) => `
    <div class="mc-row">
      <span class="mc-lbl" ${ce} onblur="editInfoCell(${i},'label',this.textContent)">${esc(r.label)}</span>
      <span class="mc-val" ${ce} onblur="editInfoCell(${i},'value',this.textContent)">${esc(r.value)}</span>
      <button type="button" class="del-x" onclick="delInfoRow(${i})">×</button>
    </div>
  `).join("") + `<button type="button" class="add-row-inline" onclick="addInfoRow()">＋ 新增欄位</button>`;

  const footHtml = `
    <div class="mc-foot" data-cslot="footBg">
      <div class="mc-btn-row">
        <button type="button" class="mc-btn-pri" data-cslot="accent" onclick="openBtnEditor('mobile')">${SVG_ICONS.phone}<span>撥打手機</span></button>
        <button type="button" class="mc-btn-sec" data-cslot="btn2Bg" onclick="openBtnEditor('website')">${SVG_ICONS.web}<span>官方網站</span></button>
      </div>
      ${buildSocialIconsHtml()}
      <button type="button" class="mc-btn-link" data-cslot="accent" onclick="shareToLine()">轉傳這張名片</button>
    </div>
  `;

  const ytId = parseYtId(state.videoUrl);
  const mediaHtml = ytId
    ? `<img src="https://i.ytimg.com/vi/${ytId}/hqdefault.jpg"><div class="mc-yt-play"><span>▶</span></div>`
    : (state.videoUrl ? `<video autoplay muted loop playsinline src="${esc(state.videoUrl)}" ${state.photoUrl ? `poster="${esc(state.photoUrl)}"` : ""}></video>` : (state.photoUrl ? `<img src="${esc(state.photoUrl)}">` : ""));

  if (state.style === "video" || state.style === "full") {
    mount.innerHTML = `<article class="mega-card"><div class="mc-video-box">${mediaHtml}</div><div class="mc-head-area" style="padding:14px 18px 10px;" data-cslot="headBg">${brandRow}${nameLine}${sloganHtml}</div><div class="mc-sep"></div><div class="mc-body" data-cslot="bodyBg">${rowsHtml}</div>${footHtml}</article>`;
  } else if (state.style === "hero") {
    mount.innerHTML = `<article class="mega-card"><div class="mc-hero-box">${state.photoUrl ? `<img class="mc-hero-img" src="${esc(state.photoUrl)}">` : ""}<div class="mc-hero-grad"><div style="display:flex;align-items:center;justify-content:space-between;">${state.logoUrl ? `<span class="mc-logo-pill"><img src="${esc(state.logoUrl)}"></span>` : "<span></span>"}<span style="color:#fff;">${coHtml}</span></div><div style="color:#fff;">${nameLine}${sloganHtml}</div></div></div><div class="mc-body" data-cslot="bodyBg">${rowsHtml}</div>${footHtml}</article>`;
  } else if (state.style === "side") {
    mount.innerHTML = `<article class="mega-card"><div class="mc-top-bar" data-cslot="accent"></div><div class="mc-side-grid"><div class="mc-side-media">${mediaHtml}</div><div class="mc-side-info mc-head-area" data-cslot="headBg">${logoHtml}${nameLine}${coHtml}</div></div><div class="mc-sep"></div><div class="mc-body" data-cslot="bodyBg">${rowsHtml}</div>${footHtml}</article>`;
  } else if (state.style === "block") {
    mount.innerHTML = `<article class="mega-card"><div class="mc-block-top" style="background:var(--head-bg);" data-cslot="headBg">${brandRow}${nameLine}${sloganHtml}</div><div class="mc-body" data-cslot="bodyBg">${rowsHtml}</div>${footHtml}</article>`;
  } else {
    const extraCls = state.style === "frame" ? "style-frame" : "";
    mount.innerHTML = `<article class="mega-card ${extraCls}"><div class="mc-top-bar" data-cslot="accent"></div><div class="mc-head-area" style="padding:14px 18px 10px;" data-cslot="headBg">${brandRow}<div style="display:flex;align-items:center;justify-content:space-between;gap:10px;"><div style="flex:1;min-width:0;">${nameLine}${sloganHtml}</div>${state.showPhoto && state.photoUrl ? `<div class="mc-photo"><img src="${esc(state.photoUrl)}"></div>` : ""}</div></div><div class="mc-sep"></div><div class="mc-body" data-cslot="bodyBg">${rowsHtml}</div>${footHtml}</article>`;
  }

  // 只有在展開「進階設定 → 配色」時，點背景區塊才切換調色部位，平常點字完全不打架
  mount.querySelectorAll("[data-cslot]").forEach(el => {
    el.addEventListener("click", (e) => {
      if (!document.getElementById("phoneScreen").classList.contains("color-pick-mode")) return;
      if (e.target.isContentEditable) return;
      e.stopPropagation();
      const slot = el.getAttribute("data-cslot");
      if (slot) { selectColorSlot(slot); toast("調色：" + (SLOT_NAMES[slot] || slot)); }
    });
  });
}

/* 拍名片 AI 辨識 + 自動去背裁切 Logo */
function cropLogoFromCard(img, box, mono, accentHex) {
  if (!Array.isArray(box) || box.length !== 4) return "";
  let [ymin, xmin, ymax, xmax] = box.map(Number);
  if ([ymin, xmin, ymax, xmax].some(isNaN) || ymax <= ymin || xmax <= xmin) return "";
  const iw = img.naturalWidth, ih = img.naturalHeight;
  const padX = (xmax - xmin) * 0.04, padY = (ymax - ymin) * 0.04;
  const sx = Math.max(0, Math.round(((xmin - padX) / 1000) * iw));
  const sy = Math.max(0, Math.round(((ymin - padY) / 1000) * ih));
  const sw = Math.min(iw - sx, Math.max(10, Math.round(((xmax - xmin + padX * 2) / 1000) * iw)));
  const sh = Math.min(ih - sy, Math.max(10, Math.round(((ymax - ymin + padY * 2) / 1000) * ih)));
  const c = document.createElement("canvas");
  const sc = Math.min(1, 520 / sw);
  c.width = Math.max(1, Math.round(sw * sc)); c.height = Math.max(1, Math.round(sh * sc));
  const ctx = c.getContext("2d");
  ctx.drawImage(img, sx, sy, sw, sh, 0, 0, c.width, c.height);
  const d = ctx.getImageData(0, 0, c.width, c.height), px = d.data, w = c.width, h = c.height;
  const corners = [0, (w - 1) * 4, ((h - 1) * w) * 4, ((h - 1) * w + (w - 1)) * 4];
  let br = 0, bg = 0, bb = 0;
  corners.forEach(idx => { br += px[idx]; bg += px[idx + 1]; bb += px[idx + 2]; });
  br /= 4; bg /= 4; bb /= 4;
  const hc = accentHex.replace("#", "");
  const ar = parseInt(hc.slice(0,2),16), ag = parseInt(hc.slice(2,4),16), ab = parseInt(hc.slice(4,6),16);
  for (let i = 0; i < px.length; i += 4) {
    const dist = Math.hypot(px[i] - br, px[i + 1] - bg, px[i + 2] - bb);
    if (dist < 42) px[i + 3] = 0;
    else if (dist < 72) px[i + 3] = Math.round(((dist - 42) / 30) * 255);
    if (mono && px[i + 3] > 0) { px[i] = ar; px[i + 1] = ag; px[i + 2] = ab; }
  }
  ctx.putImageData(d, 0, 0);
  return c.toDataURL("image/png");
}

function onOcrPick(e) {
  const f = e.target.files && e.target.files[0]; if (!f) return;
  const btn = document.getElementById("btnOcr");
  btn.disabled = true; btn.textContent = "辨識中...";
  const img = new Image();
  img.onload = async () => {
    try {
      const c = document.createElement("canvas");
      const sc = Math.min(1, 1280 / Math.max(img.naturalWidth, img.naturalHeight));
      c.width = Math.round(img.naturalWidth * sc); c.height = Math.round(img.naturalHeight * sc);
      c.getContext("2d").drawImage(img, 0, 0, c.width, c.height);
      const r = await fetch(CFG.GAS_API, {
        method: "POST", headers: { "Content-Type": "text/plain;charset=utf-8" },
        body: JSON.stringify({ action: "ecardOcr", dataUrl: c.toDataURL("image/jpeg", 0.85) })
      }).then(x => x.json());
      if (!r || !r.success || !r.data) { toast((r && r.error) || "辨識失敗"); return; }
      const d = r.data;
      if (d.company) state.company = d.company;
      if (d.name) state.name = d.name;
      if (d.enName) state.enName = d.enName;
      if (d.mobile) state.mobile = d.mobile;
      if (d.email) state.email = d.email;
      if (d.website) state.website = d.website;
      if (d.slogan) state.slogan = d.slogan;
      state.infoRows = [
        { label: "手機", value: d.mobile || "" },
        { label: "信箱", value: d.email || "" },
        { label: "電話", value: d.tel || "" },
        { label: "地址", value: d.address || "" }
      ].filter(x => x.value);
      if (d.logoBox) {
        const cr = cropLogoFromCard(img, d.logoBox, state.logoMono !== false, state.color);
        if (cr) state.logoUrl = cr;
      }
      renderSocialControls(); renderPreview(); toast("名片已自動填入");
    } catch (err) { toast("辨識失敗"); }
    finally {
      btn.disabled = false;
      btn.innerHTML = '<svg width="16" height="16" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2" stroke-linecap="round"><path d="M23 19a2 2 0 0 1-2 2H3a2 2 0 0 1-2-2V8a2 2 0 0 1 2-2h4l2-3h6l2 3h4a2 2 0 0 1 2 2z"/><circle cx="12" cy="13" r="4"/></svg>拍名片自動填入';
      e.target.value = "";
    }
  };
  img.src = URL.createObjectURL(f);
}

/* 素材上傳 */
function onLogoPick(e) {
  const f = e.target.files && e.target.files[0]; if (!f) return;
  const img = new Image();
  img.onload = () => {
    const c = document.createElement("canvas");
    const sc = Math.min(1, 560 / img.naturalWidth);
    c.width = Math.round(img.naturalWidth * sc); c.height = Math.round(img.naturalHeight * sc);
    const ctx = c.getContext("2d"); ctx.drawImage(img, 0, 0, c.width, c.height);
    if (state.logoMono) { ctx.globalCompositeOperation = "source-in"; ctx.fillStyle = state.color; ctx.fillRect(0, 0, c.width, c.height); }
    state.logoUrl = c.toDataURL("image/png"); renderPreview();
  };
  img.src = URL.createObjectURL(f);
}
function clearLogo() { state.logoUrl = ""; renderPreview(); }
function onPhotoPick(e) {
  const f = e.target.files && e.target.files[0]; if (!f) return;
  const img = new Image();
  img.onload = () => {
    const c = document.createElement("canvas");
    const sc = Math.min(1, 900 / Math.max(img.naturalWidth, img.naturalHeight));
    c.width = Math.round(img.naturalWidth * sc); c.height = Math.round(img.naturalHeight * sc);
    c.getContext("2d").drawImage(img, 0, 0, c.width, c.height);
    state.photoUrl = c.toDataURL("image/jpeg", 0.86); state.showPhoto = true; document.getElementById("chkPhoto").checked = true; renderPreview();
  };
  img.src = URL.createObjectURL(f);
}
function onVideoPick(e) {
  const f = e.target.files && e.target.files[0]; if (!f) return;
  if (f.size > 10 * 1024 * 1024) { toast("超過 10MB"); e.target.value = ""; return; }
  const objUrl = URL.createObjectURL(f);
  const v = document.createElement("video"); v.preload = "metadata";
  v.onloadedmetadata = () => {
    if (v.duration > 10.5) { toast("超過 10 秒"); URL.revokeObjectURL(objUrl); e.target.value = ""; return; }
    state.videoUrl = objUrl; document.getElementById("inVideoUrl").value = f.name;
    document.getElementById("btnDelVideo").style.display = "inline-flex"; setStyle("video");
  };
  v.src = objUrl;
}
function clearVideo() { state.videoUrl = ""; document.getElementById("inVideoUrl").value = ""; document.getElementById("btnDelVideo").style.display = "none"; renderPreview(); }
function convertYoutube() {
  if (!parseYtId(state.videoUrl)) { toast("請先貼入 YouTube 網址"); return; }
  setStyle("video"); toast("已套用 YouTube 影片");
}

/* 儲存 + Telegram 通知 */
async function saveCard() {
  if (localEditUsed >= 3 && !(profile && profile.donated)) { openDonateModal(); return; }
  localEditUsed++;
  localStorage.setItem("ck_local_edit_used", String(localEditUsed));
  localStorage.setItem("ck_state_v8", JSON.stringify(state));
  const btn = document.getElementById("btnSave");
  btn.disabled = true; btn.textContent = "儲存中";
  try {
    const r = await fetch(CFG.GAS_API, {
      method: "POST", headers: { "Content-Type": "text/plain;charset=utf-8" },
      body: JSON.stringify({ action: "ecardNotifyCreate", cardId: (profile && profile.slug) || currentCardId || "", userEmail: (session && session.user && session.user.email) || "", config: state })
    }).then(x => x.json());
    if (r && r.success && r.cardId) { currentCardId = r.cardId; localStorage.setItem("ck_my_card_id", currentCardId); }
    toast("已儲存");
  } catch (e) { toast("已儲存"); }
  finally { btn.disabled = false; btn.textContent = "儲存"; }
}

function openAuthModal() { document.getElementById("authModal").style.display = "flex"; }
function closeAuthModal() { document.getElementById("authModal").style.display = "none"; }
function openDonateModal() { document.getElementById("donateModal").style.display = "flex"; }
function closeDonateModal() { document.getElementById("donateModal").style.display = "none"; }
function setAuthMode(m) {
  authMode = m;
  document.getElementById("tabLogin").classList.toggle("active", m === "login");
  document.getElementById("tabReg").classList.toggle("active", m === "register");
  document.getElementById("btnAuthGo").textContent = m === "register" ? "註冊" : "登入";
}
async function submitAuth() {
  if (!sb) return;
  const email = document.getElementById("authEmail").value.trim(), password = document.getElementById("authPass").value;
  if (!email || !password) return;
  const res = authMode === "register" ? await sb.auth.signUp({ email, password }) : await sb.auth.signInWithPassword({ email, password });
  if (res.error) { toast(res.error.message); return; }
  closeAuthModal(); toast(authMode === "register" ? "註冊成功" : "已登入");
}

function toggleChatTheme() {
  const s = document.getElementById("phoneScreen"), d = s.classList.toggle("dark-chat");
  document.getElementById("btnTheme").innerHTML = d
    ? '<svg width="17" height="17" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2" stroke-linecap="round"><path d="M21 12.79A9 9 0 1 1 11.21 3 7 7 0 0 0 21 12.79z"/></svg>'
    : '<svg width="17" height="17" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2" stroke-linecap="round"><circle cx="12" cy="12" r="4"/><path d="M12 2v2M12 20v2M4.93 4.93l1.41 1.41M17.66 17.66l1.41 1.41M2 12h2M20 12h2M6.34 17.66l-1.41 1.41M19.07 4.93l-1.41 1.41"/></svg>';
}

function shareToLine() {
  const slug = (profile && profile.slug) || currentCardId || "bigt";
  window.open(`https://liff.line.me/${CFG.LIFF_ID}?mode=card&id=${encodeURIComponent(slug)}`, "_blank", "noopener");
}

async function loadPreviewParamIfAny() {
  const pid = new URLSearchParams(location.search).get("preview");
  if (!pid) return;
  try {
    const r = await fetch(CFG.GAS_API + "?ac=ecardGet&id=" + encodeURIComponent(pid)).then(x => x.json());
    if (r && r.success && r.config) {
      state = Object.assign(defaultState(), r.config);
      currentCardId = pid; syncCssVars(); renderSocialControls(); renderPreview();
    }
  } catch (e) {}
}

let tTimer;
function toast(msg) {
  const el = document.getElementById("toast"); el.textContent = msg; el.classList.add("show");
  clearTimeout(tTimer); tTimer = setTimeout(() => el.classList.remove("show"), 2000);
}

syncCssVars();
renderSocialControls();
renderPreview();
loadPreviewParamIfAny();
</script>
